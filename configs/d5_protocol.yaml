      dung va 2,915 de xuat ung vien. Ghi duong dan bang chung cho catalogue,
      matched reference va counterfactual. Khong doi cong thuc, luoi, dieu
      kien chon, metric hoac noi dung lan chay v0.6.0 da luu. Ban protocol
