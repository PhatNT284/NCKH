# nen phai giu them SHA-256. Hash duoi day la anh chup luc soan ban nhap,
# KHONG tu no chung nhan ket qua D4 da duoc kiem cheo.
input_snapshot_at_draft:
  base_git_commit: "651cc8350efca3fe05b7cc697ddae1a128a9a0e4"
  tracked_local_outputs_modified: true
  sha256:
    configs/d2_protocol.yaml: "bc73374f2734ce8e30bfb4d86844ed461b6142ceae67a8740b7e5806f202bd59"
    configs/d3_protocol.yaml: "70488c37a2307f5e17074376f06e3a4327eb303437de76c9f6e71b6a0e835143"
    configs/d4_protocol.yaml: "84219016e8c83d7594a74d7d7a2f6f2db787e0e88115a64137576cbbd4391025"
    reports/d2_oof_residuals.csv: "607d58f951498c40e94dd415ad3c8f598b66af5f9f496e2c55e8d9913ca0f2df"
    reports/d4_scenarios.csv: "cc2550ef77267e877bc10398d538ceec00c86b8e51513f4591021b08ba341da8"
