    reports/d4_d2_frozen_coefficients.csv: "081c06e7a0aa2d0d79a0a255e1c707bce455e47cd7ec4c89d5fe9e09a7e0a423"
  mismatch_policy: >-
    Bao khac phien ban va lap manifest cho lan chay moi; khong ghi de hash de
