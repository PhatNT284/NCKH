          (4) gia dinh hanh trinh: toc do = speed_commanded_ms, do cao =
              altitude_m, ca hai la tham so ke hoach va nam trong tap dac trung.
          Them: E_hover = 0 vi bo du lieu khong co diem giao hang.
        basis: >
          P§4.5 nguyen van: "subject to an explicit convention that prevents
          double counting... are all recorded in the mission record and fixed
          before evaluation."
        impact: >
          KHONG doi hanh vi he thong. Day la khai bao dieu he thong DANG lam.
          Nhung no chan mot loi that: truoc ban va nay, mot nguoi doc giao thuc
          co the ket luan rang nang luong ha canh chua duoc tinh, roi cong them
          vao E_required hoac nang r len — tuc DEM HAI LAN theo huong lam he
          thong qua thuan trong (tu choi thua), hoac nguoc lai.
        found_how: >
          Phat hien khi ra soat cau hoi "he so du tru r = 0.20 bu cho nhung rui
          ro nao?". Tra P§4.5 thi thay cau tra loi khong nam o r ma nam o
          E_required, va thay bat khai bao ro — ma repo chua khai.
      - id: "B9b"
        question: "minimum_soc dinh nghia the nao de khong lan voi ha canh thuong?"
        resolution: >
          Dinh nghia lai ro: SAN AN TOAN KHI CO SU CO (huy chuyen giua duong),
          KHONG phai ha canh binh thuong cuoi chuyen. Ghi lien ket cheo sang
          energy_required.budget_conventions muc (2).
        basis: >
          Dinh nghia cu — "SoC toi thieu de con du nang luong ha canh tu do cao
          hanh trinh" — doc ra nghia ha canh thuong, ma cai do da trong
          E_required. Giu nguyen la mo duong cho loi dem hai lan.

  - version: "1.4.0"
    date: "2026-10-20"
    author: "Phat"
    changes: >
      Cai luat PH-1 (san nang luong ha canh) theo P§4.6. Them bat bien INV-8.
      Dong OI-D3-1.
      DOI HANH VI — PHAI chay lai src.evaluation_decision va cap nhat 4 CSV
      trong reports/. Cac bang cua san pham D2 KHONG bi anh huong.
    decisions:
      - id: "B10"
        question: >
          P§4.6 doi mot san SoC "so that the aircraft retains the energy
          required to land from its cruise altitude". Cai the nao, va muc do nao?
        resolution: >
          Luat PH-1, muc do VETO. San cho SoC:
              available_energy(soc, soh, T) >= landing_energy_Wh(altitude_m,
                                                                 takeoff_mass_g)
          Toc do ha 1.5 m/s theo Rodrigues et al. Cong suat ha = cong suat bay
          treo cung khoi luong (can bao thu, vi thieu he so can canh quat).
          Khai thanh muc rieng `physics_derived` vi nguon goc khac HR-1..HR-4.
        basis: >
          VETO vi day KHONG phai gioi han hieu luc cua mo hinh (nhu PD-*) ma la
          mot thuc te vat ly: khong du pin de dap xuong dat. Cho nguoi duyet lat
          mot chuyen nhu vay la nguy hiem that.
          Nhung ve NGUON GOC thi PH-1 giong PD-* hon — con so tu mo hinh vat ly
          cua nhom voi eta khop tu mot diem, khong phai DJI cong bo. Nen tach
          muc rieng va bat khai ro nguon khi bao cao.
        impact: >
          DA CHAY LAI VA XAC NHAN BANG SO (20/10/2026):
            - Nguong PH-1 doi SoC 2.5-12.0 %, trung vi 6.0 %.
            - Nguong luat du tru doi SoC 16.2-42.0 %, trung vi 26.5 %.
            - Hai dai KHONG CHONG NHAU: 12.0 < 16.2.
            - So chuyen ma PH-1 rang buoc hon luat du tru: 0/192.
          => Bang phan quyet KHONG DOI: van 187 FLY / 5 CONDITIONAL / 0 NO_FLY
          tu SoC 0.50 tro len. Moi bang trong reports/ ve phan quyet giu nguyen.
          NHUNG PH-1 KHONG phai code chet: o SoC 0.10 no chan 30/192 chuyen
          (cot ph1_violated trong d3_verdict_grid.csv). Phan quyet van la NO_FLY
          nhung LY DO doi — khong du pin dap xuong dat, chu khong phai thieu
          bien du tru.
          O san pham D4 thi PH-1 CO tac dung: kich ban "chuyen ngan + bay cao"
          la cho luat du tru long hon PH-1.
        found_how: >
          Phat hien khi ra soat cau hoi "he so du tru 20 % bu cho nhung gi".
          Ban dau nhom tuong day la viec can hoi thay; tra lai P§4.6 thi thay
          thay DA chon san cach lam, chi la nhom chua tinh. Bai hoc: tra file
          truoc khi ket luan la thieu.
      - id: "B10b"
        question: >
          PH-1 can nang luong kha dung, nhung §4.6 doi lop luat cung chay
          DOC LAP voi mo hinh. Co pha vo khong?
        resolution: >
          Khong. Truyen `soc` va `soh` (DAU VAO THO) vao check_hard_rules(), va
          de lop luat cung TU GOI available_energy(). Chu ky ham khong co tham
          so nao mang ten nang luong — test test_lop_nay_khong_nhan_dau_ra_mo_hinh
          quet chu ky va van xanh.
        basis: >
          §4.6 cam lop luat cung nhan dau ra MO HINH DU BAO. e_available la
          CONG THUC §5.4 (E_nominal * SoC * SoH * kappa), khong phai dau ra mo
          hinh. Va §5.7 liet ke san trong lop an toan: "battery/SoC input valid
          and within allowed bounds". Lop nay van KHONG biet gi ve E_required.
        safeguard: >
          Thieu hoac ngoai dai -> PH-1 bao MISSING (fail closed). Va buoc "dau
          vao pin sai dai -> NO_FLY" phai xet TRUOC buoc thieu du lieu, neu
          khong thi SoC = 1.5 se ra INSUFFICIENT_DATA thay vi NO_FLY — sai
          quyet dinh B5. Co test canh: test_soc_ngoai_dai_la_no_fly_*.