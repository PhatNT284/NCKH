        basis: >
          Muc 12.1 doi "one-way versus round-trip distance explicit" va truoc
          ban va nay KHONG CHO NAO trong repo noi toi. Tra bai Rodrigues et al.
          2021 muc Methods xac nhan duong bay vong kin va tai mang suot chuyen.
        impact: >
          Khong doi con so nao, nhung doi CACH DOC envelope. Mot nhiem vu giao
          hang "472 m toi khach" bay ~944 m khu hoi, NGOAI envelope.
      - id: "B8"
        question: "CONDITIONAL can gi de thuc thi duoc?"
        resolution: >
          Phai chon mot bien phap giam thieu hop le VA danh gia lai. Chua chon
          thi actionable = False. Them src/mitigations.py voi 7 bien phap chia
