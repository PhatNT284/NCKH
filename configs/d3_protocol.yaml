        basis: >
          Muc 12.1 doi "conditional verdicts require an explicit mitigation";
          §2.3 noi ro "actionable only when an approved mitigation is selected
          and the scenario is re-evaluated". Ban truoc tra CONDITIONAL kem mot
          dong ly do roi het — mot nhan, chua phai trang thai co duong ra.

  - version: "1.3.0"
    date: "2026-10-19"
    author: "Phat"
    changes: >
      Khai day du bon quy uoc ngan sach nang luong theo P§4.5 (truoc do chi khai
