        question: >
          P§4.5 bat khai bon quy uoc ngan sach nang luong de chong dem hai lan.
          Giao thuc 1.2.0 chi khai mot. Ba cai con lai la gi?
        resolution: >
          (1) cu ly: ROUND_TRIP (da co, B7).
          (2) nang luong cat/ha canh: DA NAM TRONG output cua mo hinh, vi muc
              tieu D2 la tong nang luong ca chuyen (§4.2 buoc 4). KHONG cong them.
          (3) chang ve mang tai: CO (Velcro, mang suot chuyen). Lech ve phia
