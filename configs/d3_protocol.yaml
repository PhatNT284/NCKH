# =============================================================================
# GIAO THUC DA DONG BANG — D3: Bo may quyet dinh co y thuc an toan
# =============================================================================
# File nay la ban dong bang cua Tuan 7 (ke hoach 12 tuan cua thay).
# Song song voi configs/d2_protocol.yaml, KHONG thay the no.
#
# QUY TAC: moi thay doi trong file nay PHAI
#   (1) ghi ly do vao muc `change_log` o cuoi file,
#   (2) chay lai toan bo kiem dinh bi anh huong,
#   (3) duoc nguoi kiem cheo cua WP3 (Duy) xac nhan.
#
# Tham chieu:
#   §x.y  -> Delivery_UAV_Preflight_Feasibility_Proposal_updated.md (file cua thay)
#   P§x.y -> Proposal.docx (ban nhom da sua)
#   Eq(n) -> Proposal.docx, cong thuc danh so
# =============================================================================

meta:
  version: "1.4.0"
  frozen_on: "2026-10-20"
  owner: "Phat (WP3)"
  cross_checker: "Duy"
  cross_check_status: "PENDING"
  work_package: "WP3"
  deliverable: "D3"
  depends_on:
    - "configs/d2_protocol.yaml >= 1.4.0"
    - "reports/model_selection_report.md"
    - "reports/parameter_table.md"
  gate_cleared: >
    San pham D2 nghiem thu 14/10/2026 (4/4 tieu chi Muc 12.1). Cong chan cua
    thay — "chi chon mo hinh nang luong sau khi xem ket qua kiem dinh" — da mo.

# -----------------------------------------------------------------------------
# 0. NGUYEN TAC NEN — doc truoc khi doc phan con lai
# -----------------------------------------------------------------------------
# Bo du lieu CMU KHONG co SoH, KHONG co bien thien nhiet do co kiem soat,
# KHONG co nhan ket cuc nhiem vu (§4.3, §4.7). Do do de tai chay HAI NHANH
# danh gia tach biet (P§1.3: "Evaluation proceeds along two separate tracks"):
#
#   Nhanh 1 — Nang luong CAN  -> du lieu that, 192 chuyen  -> san pham D2 (XONG)
#   Nhanh 2 — Quyet dinh      -> kich ban tong hop         -> san pham D3 + D4
#
# He qua rang buoc cho D3:
#   - D3 KHONG chua mo hinh hoc may nao. Toan bo la cong thuc va luat.
#   - SoH va nhiet do la THAM SO KICH BAN tu ngoai dua vao, khong hoc duoc.
#   - D3 chay tren 192 chuyen chi de MINH HOA va kiem tinh nhat quan,
#     KHONG de cham diem dung/sai — khong co dap an de so.
#   - Viec cham diem quyet dinh thuoc san pham D4, tren tap kich ban.

foundation:
  d3_contains_no_learned_model: true
  evaluation_of_decisions: "san pham D4, tren tap kich ban tong hop (§4.7)"
  run_on_192_flights_is_for: ["minh hoa", "kiem bat bien", "bang vi du cho bai"]

# -----------------------------------------------------------------------------
# 1. DAU VAO CUA MOT LAN DANH GIA
# -----------------------------------------------------------------------------
inputs:
  source_ref: "§4.2 Proposal (mission record), §4.3 (bang bien kha dung)"

  mission_plan:                      # ke hoach bay — biet truoc khi cat canh
    - {name: "payload_g",        unit: "g",   required: true}
    - {name: "speed_commanded_ms", unit: "m/s", required: true}
    - {name: "altitude_m",       unit: "m",   required: true}
    - {name: "distance_2d_m",    unit: "m",   required: true}
    - {name: "wind_forecast_ms", unit: "m/s", required: true}

  battery_state:
    - {name: "soc", unit: "-", required: true,
       note: "Q(t)/Q_tot,t. §4.3: KHONG phai dac trung do duoc cua bo du lieu;
              la dau vao kich ban tru khi xac nhan duoc trong file goc."}
    - {name: "soh", unit: "-", required: true,
       note: "Q_tot,t/Q_tot,i. §4.3: THAM SO KICH BAN. Dung dai tu tai lieu.
              CAM huan luyen du bao SoH tren bo du lieu nay."}
    - {name: "battery_type", values: ["TB47D", "TB48D"], required: true}

  environment:
    - {name: "ambient_temp_c", unit: "C", required: true,
       note: "§4.3: THAM SO KICH BAN, khong phai bien day du co kiem soat.
              Chi dung qua quan he suy giam co chan, co trich dan, va chi nhu
              phan tich do nhay."}

  distance_convention:
    decision_ref: "B7"
    source_ref: "Muc 12.1 (D3): 'one-way versus round-trip distance explicit'; §4.3"
    dataset_is: "ROUND_TRIP"
    evidence: >
      Rodrigues et al., Scientific Data 8, 155 (2021), muc Methods:
      "tracks a triangular wind-neutral path while recording the data" va
      "reaches the launch point again, the UAV stops and descends at
      approximately 1.5 m/s". Chuyen bay la VONG KIN tam giac, quay ve dung
      diem cat canh. Tai trong gan bang Velcro, MANG SUOT CHUYEN, khong tha.
      Bo du lieu KHONG co khai niem diem giao hang — day la duong bay thu.
    definition: >
      distance_2d_m = tong quang duong bay thuc te cua CA VONG KIN, cong don
      haversine theo tung mau GPS. KHONG phai cu ly mot chieu toi diem giao hang.
    envelope_two_readings:
      total_path_m: [420, 610]          # nhu du lieu, vong kin
      one_way_delivery_m: [210, 305]    # xap xi, chia doi
      rule: >
        Khi bao cao PHAI noi ro dang dung cach doc nao. Mot nhiem vu giao hang
        that "472 m toi khach" se bay ~944 m khu hoi, NAM NGOAI envelope.
        Viet nham thi bai bao noi sai gap doi.
    mass_mismatch_to_state_in_paper: >
      Giao hang that thi chang ve nhe hon vi da tha hang; bo du lieu mang tai
      suot chuyen. Mo hinh se DOAN THUA nang luong chang ve — lech ve phia an
      toan, nhung van phai khai bao.
    open_check: "RS-3 — tong cu ly 92.8 km (192 chuyen) vs ~65 km bai goc neu
                 cho 209 chuyen; chua giai thich duoc, xem open_items"

  derived_from_plan:
    duration_planned_s:
      formula: "distance_2d_m / speed_commanded_ms"
      note: "Giong hệt D2-b. Phai dung CUNG mot cong thuc, neu khac thi mo hinh
             nhan dau vao khac voi luc huan luyen."

# -----------------------------------------------------------------------------
# 2. NANG LUONG KHA DUNG (khoi a)
# -----------------------------------------------------------------------------
available_energy:
  source_ref: "§5.4, Eq (2)"
  formula: "E_available = E_nominal * SoC * SoH * kappa(T)"

  e_nominal:
    primary_Wh: 99.9                 # TB47D
    sensitivity_Wh: 129.96           # TB48D
    basis: >
      OI-2 da dong o d2_protocol 1.3.0. Bai Rodrigues TU MAU THUAN ve loai pin;
      3/4 bang chung doc lap chi ve TB47D, va 99.9 la gia tri NHO HON nen la
      huong bao thu. Chi tiet: reports/parameter_table.md muc 1.1.
    mandatory_sensitivity: >
      BAT BUOC chay lai toan bo o san pham D4 voi 129.96 Wh va bao ket luan
      thay doi the nao (§8 muc 3).

  soc_soh_convention:
    expression: "SoC * SoH = Q(t)/Q_tot,t * Q_tot,t/Q_tot,i = Q(t)/Q_tot,i"
    meaning: "dien tich hien co so voi dung luong luc pin con moi"
    warning: >
      P§4.4 canh bao hai dai luong nay duoc dinh nghia khac nhau trong tai lieu;
      ghep nham cap se DEM DUNG LUONG HIEN TAI HAI LAN. Quy uoc tren phai viet
      ro trong bai, khong de ngam hieu.

  kappa_temperature:
    polynomial: "0.8814 + 0.0091*T - 0.0001*T^2"
    source: "Kim et al."
    calibrated_range_c: [4.5, 18.4]
    rule: |
      T < 4.5    -> kappa = poly(4.5) = 0.9203     # giu o bien lanh
      4.5<=T<=18.4 -> kappa = min(1, poly(T))
      T > 18.4   -> kappa = 1.0                    # chan tren
    decision_ref: "B3"
    rationale: >
      Quy tac cu (kappa = 1 cho MOI nhiet do ngoai dai) SAI o phia lanh: tai
      4.4 C no nhay tu 0.920 len 1.000, tuc cang lanh cang gia dinh pin cang
      khoe. Pin LiPo lanh thi tut dung luong, nen quy tac cu lam E_available bi
      tinh THUA -> bien du tru ao -> cho bay chuyen khong du pin. Day dung loai
      loi ma de tai sinh ra de chong.
      Quy tac moi giu o gia tri bien lanh 0.9203: khong ngoai suy (§5.4 cam),
      lien tuc, va bao thu.
    upper_clamp_reason: >
      Da thuc goc tra ve >1 trong khoang ~15.8-75.2 C, dat 1.089 tai 45.5 C —
      tuc khang dinh pin chua nhieu nang luong hon muc danh dinh cua chinh no.
      Vo ly ve vat ly.
    limitation_to_state_in_paper: >
      Dai van hanh M100 la -10..40 C, dai hieu chinh cua Kim chi 4.5-18.4 C.
      PHAN LON vung van hanh nam ngoai dai hop le. Mo hinh hien KHONG mo ta
      duoc anh huong nhiet do tren phan lon dai van hanh; ket qua lien quan
      nhiet do trinh bay nhu PHAN TICH DO NHAY, khong phai du bao.

# -----------------------------------------------------------------------------
# 3. NGAN SACH NHIEM VU (khoi b)
# -----------------------------------------------------------------------------
energy_required:
  estimator: "D2_ridge_preflight"
  source_ref: "reports/model_selection_report.md"
  frozen: true
  rule: >
    KHONG huan luyen lai, KHONG tinh chinh, KHONG doi tap dac trung. D3 chi GOI
    mo hinh da chot. Doi mo hinh la doi san pham D2, phai nghiem thu lai.

  # ---------------------------------------------------------------------------
  # 3.1 — QUY UOC NGAN SACH NANG LUONG — §4.5, chong dem hai lan
  # ---------------------------------------------------------------------------
  # P§4.5 nguyen van: cong thuc (4) la
  #     E_required = E_outbound + E_return + E_hover
  # "subject to an explicit convention that prevents double counting. Whether
  #  the stated route distance is one-way or round-trip, whether take-off and
  #  landing energy is already contained in the estimator's output, whether the
  #  return leg carries the payload, and what cruise speed and altitude are
  #  assumed are all recorded in the mission record and fixed before evaluation."
  #
  # Bon quy uoc do khai o day. Thieu mot cai la mo duong cho loi dem hai lan.
  budget_conventions:
    decision_ref: "B9"
    source_ref: "P§4.5, Eq (4)"

    # (1) — da khai o inputs.distance_convention, nhac lai cho du bon
    distance_convention: "ROUND_TRIP"
    distance_convention_ref: "inputs.distance_convention, quyet dinh B7"

    # (2) — nang luong cat canh va ha canh
    takeoff_landing_energy: "INCLUDED_IN_ESTIMATOR_OUTPUT"
    takeoff_landing_rationale: >
      Muc tieu du bao cua D2 la TONG nang luong CA CHUYEN BAY, khong phan doan
      theo pha. §4.2 buoc 4 cho phep: "If phase segmentation is unreliable, use
      total flight energy as the primary target" — nhom chon phuong an do vi cot
      vi tri o don vi do kem nhieu GPS, va cot van toc lech 2.4 % so voi vi tri,
      nen khong cat duoc ranh gioi pha mot cach nhat quan.
      Chuyen bay CMU la vong kin day du: cat canh, leo, hanh trinh, ha, dap dat
      (Rodrigues et al., Methods: "reaches the launch point again, the UAV stops
      and descends at approximately 1.5 m/s").
      => E_required DA BAO GOM nang luong cat canh va ha canh.
    takeoff_landing_prohibition: >
      TUYET DOI khong cong them mot khoan nang luong ha canh vao E_required, va
      khong nang he so du tru r de "bu cho ha canh". Lam vay la DEM HAI LAN,
      dung loi ma §4.5 sinh ra de chong.
      Phan ha canh KHAN CAP giua chuyen la viec khac — xem hard_rules.minimum_soc.

    # (3) — chang ve co mang tai khong
    return_leg_carries_payload: true
    return_leg_rationale: >
      Tai trong gan bang Velcro va MANG SUOT CHUYEN, khong tha. Bo du lieu
      KHONG co khai niem diem giao hang — day la duong bay thu.
    return_leg_bias_direction: >
      Nhiem vu giao hang THAT thi chang ve nhe hon vi da tha hang, nen mo hinh
      huan luyen tren bo du lieu nay se DOAN THUA nang luong chang ve. Lech ve
      phia AN TOAN (tu choi thua, khong phai cho bay nham), nhung van phai
      khai bao va neu trong phan han che cua bai.

    # (4) — gia dinh toc do va do cao hanh trinh
    cruise_speed_assumption: "speed_commanded_ms (toc do RA LENH, khong phai do duoc)"
    cruise_altitude_assumption: "altitude_m (do cao ke hoach)"
    cruise_rationale: >
      Ca hai la tham so KE HOACH, biet truoc khi cat canh, va ca hai nam trong
      tap dac trung cua D2_ridge_preflight. §5.5 bat khai bao gia dinh toc do
      hanh trinh — day la cho khai.
      duration_planned_s = distance_2d_m / speed_commanded_ms, xem
      inputs.derived_from_plan.

    # So hang thu ba cua cong thuc (4)
    e_hover_Wh: 0.0
    e_hover_rationale: >
      Cong thuc (4) co so hang E_hover cho thoi gian treo TAI DIEM GIAO HANG.
      Bo du lieu CMU khong co diem giao hang (tai mang suot chuyen, khong tha),
      nen so hang nay = 0 trong moi danh gia chay tren 192 chuyen.
      KHONG phai nhom bo sot: no bang 0 vi nhiem vu khong co pha treo giao hang.
    e_hover_future_rule: >
      Neu sau nay ap he thong cho nhiem vu giao hang THAT (co tha hang) thi
      PHAI cong E_hover tro lai, va phai khai lai quy uoc (3) vi luc do chang
      ve khong mang tai.

  measured_error:
    # NHAT QUAN: moi con so duoi day tinh tu PHAN DU OUT-OF-FOLD GOP
    # (reports/d2_oof_residuals.csv, cot D2_ridge_preflight, 192 dong).
    # Dung nguon nay vi nguong FLY o muc 5 can mot phan vi, ma phan vi chi
    # tinh duoc tren phan du tung chuyen, khong tinh duoc tu trung binh fold.
    basis: "phan du out-of-fold gop, 192 chuyen"
    MAE_Wh: 0.6554
    RMSE_Wh: 0.8386
    bias_Wh: 0.0105
    p95_abs_residual_Wh: 1.4687      # dung cho nguong FLY, xem muc 5
    ci95_MAE_Wh: [0.5818, 0.7285]    # bootstrap cap chuyen bay, 2000 lan
    source: "reports/d2_oof_residuals.csv, reports/d2_bootstrap_mae_ci.csv"
    note_on_second_source: >
      reports/d2_e2a_flight_level_cv.csv bao TRUNG BINH QUA CAC FOLD, nen lech
      o chu so thap phan thu ba: MAE 0.6570, RMSE 0.8402, bias 0.0099. Hai cach
      tinh deu dung, chi khac don vi lay trung binh (chuyen bay vs fold). Bai
      bao dung so cua E2a cho bang xep hang; D3 dung so gop vi can phan vi.
      KHONG duoc tron hai nguon trong cung mot bang.

  validity_envelope:
    distance_2d_m: [420, 610]
    source_ref: "thi nghiem E2c, d2_protocol.yaml"
    evidence: >
      Huan luyen chi tren 180 chuyen R1 (~472 m), du bao 5 chuyen ~835 m:
      bias = -7.613 Wh = -MAE, tuc DOAN THIEU ca 5 chuyen, trung binh 29.6 %,
      toan bo ve phia nguy hiem.
    enforcement: "xem muc 4.2 — day KHONG phai luat cung cua nha san xuat"

# -----------------------------------------------------------------------------
# 3b. HO SO MAY BAY — phai chon truoc khi ap luat cung
# -----------------------------------------------------------------------------
# May bay trong bo du lieu CMU KHONG phai M100 nguyen ban: no mang them 1249 g
# thiet bi do (cam bien gio 136 g + may tinh tren khoang 1113 g). Tong chua tai
# da la 3680 g, VUOT MTOW 3600 g cua DJI.
#
# He qua: ap thang luat HR-3 thi CA 192 CHUYEN deu thanh NO_FLY, ke ca chuyen
# khong tai -> benchmark vo nghia. Nhung bo luat HR-3 di thi mat mot rang buoc
# an toan that. Nen phai tach HAI HO SO.
aircraft_profiles:
  source_ref: "reports/parameter_table.md muc 3.1"
  decision_ref: "B6"

  M100_stock:
    description: "M100 nguyen ban — ho so VAN HANH ma he thong D3 mo phong"
    airframe_mass_g: {TB47D: 2355, TB48D: 2431}
    mtow_g: 3600
    max_payload_g: {TB47D: 1245, TB48D: 1169}
    mtow_rule: "VETO — vuot MTOW thi NO_FLY"
    note: "Day la ho so mac dinh. Moi ket qua D3/D4 bao cao tren ho so nay."

  CMU_instrumented:
    description: "May bay thuc te trong bo du lieu — co thiet bi do"
    airframe_mass_g: 3680
    instrumentation_mass_g: 1249
    mtow_g: 3600
    mtow_rule: "KNOWN_EXCEEDED — ghi nhan, KHONG veto"
    rationale: >
      Theo khuyen nghi reports/parameter_table.md muc 3.1: ghi MTOW vao bang
      tham so nhu "rang buoc da biet bi vuot", neu trong phan han che cua bai,
      KHONG dung lam luat chan trong benchmark. Neu veto thi 192/192 chuyen
      NO_FLY va khong con gi de do.
    payload_rule_instead: >
      Thay vi MTOW, dung dai do phu du lieu 0-500 g (luat PD-2). Ngoai dai do
      la ngoai suy, phai danh dau.
    must_state_in_paper: >
      TOAN BO 192 chuyen vuot MTOW nha san xuat cong bo (3680-4180 g so voi
      3600 g). Bai Rodrigues khong nhac toi gioi han nay. Phai neu trong phan
      han che.

# -----------------------------------------------------------------------------
# 4. LOP LUAT CUNG (khoi d)
# -----------------------------------------------------------------------------
hard_rules:
  source_ref: "§4.6 Proposal, §5.7"
  semantics: >
    Lop nay chay DOC LAP voi mo hinh va chi duoc GIU NGUYEN hoac HA CAP phan
    quyet. Nguyen van §4.6: "no score, no model output and no human approval
    may convert a hard-rule violation into FLY."
  veto: true
  severity:
    manufacturer: "VETO — vi pham thi NO_FLY, khong gi lat duoc"
    project_derived: "DOWNGRADE — khong duoc tra FLY, cao nhat la CONDITIONAL
                      kem nhan EXTRAPOLATED"
    rationale: >
      Hai loai co nguon goc khac nhau nen muc do khac nhau. Luat nha san xuat la
      gioi han vat ly/chung nhan -> chan tuyet doi. Gioi han nhom rut ra tu thi
      nghiem la gioi han HIEU LUC CUA MO HINH -> van bay duoc, nhung he thong
      phai noi ro no dang ngoai suy va can nguoi duyet.
  no_score_aggregation: >
    §5.6 loai bo cach cham diem gop. KHONG duoc tron vi pham luat cung vao mot
    diem so roi de bien du tru cao bu lai.

  # 4.1 — Luat tu nha san xuat (DJI Matrice 100)
  manufacturer:
    - {id: "HR-1", check: "wind_forecast_ms <= 10.0",        unit: "m/s", source: "DJI"}
    - {id: "HR-2", check: "-10 <= ambient_temp_c <= 40",     unit: "C",   source: "DJI"}
    - {id: "HR-3", check: "takeoff_mass_g <= mtow_g",        unit: "g",   source: "DJI",
       depends_on_profile: true,
       note: "VETO voi M100_stock; KNOWN_EXCEEDED voi CMU_instrumented — xem muc 3b"}
    - {id: "HR-4", check: "speed_commanded_ms <= 17",        unit: "m/s", source: "DJI (che do GPS)"}

  payload_rule:
      do_not_use_value_g: 1245
      use_range_g: [0, 500]
      reason: >
        PHAT HIEN o d2_protocol 1.3.0: may bay trong bo du lieu nang 3680-4180 g,
        VUOT MTOW 3600 g cua DJI o MOI cau hinh. Con so 1245 g tinh tu may bay
        nguyen ban, khong ap duoc cho may bay da gan thiet bi do. Dai hop le
        theo do phu du lieu la 0-500 g.
        Chi tiet: reports/parameter_table.md muc 3.1.

  # 4.1b — Luat tu NGUYEN TAC cua thay, CON SO tu mo hinh vat ly cua nhom
  # ---------------------------------------------------------------------------
  # NGUON GOC va MUC DO la HAI TRUC KHAC NHAU:
  #   HR-1..HR-4   DJI cong bo                     -> VETO
  #   PH-1         nguyen tac P§4.6 + con so nhom  -> VETO
  #   PD-1, PD-2   thi nghiem cua nhom             -> DOWNGRADE
  # PH-1 la VETO vi no KHONG phai gioi han hieu luc cua mo hinh (nhu PD-*) ma
  # la mot thuc te vat ly: khong du pin de dap xuong dat. Nhung con so KHONG
  # phai DJI cong bo, nen tach muc rieng va BAT khai ro nguon khi bao cao.
  physics_derived:
    - id: "PH-1"
      check: "available_energy(soc, soh, T) >= landing_energy_Wh(altitude_m, takeoff_mass_g)"
      severity: "VETO"
      source: "P§4.6 (nguyen tac) + src/physics_m100.py (con so)"
      principle_quote: >
        "A minimum state of charge is added, set so that the aircraft retains
        the energy required to land from its cruise altitude, following the
        principle of placing a safety limit ahead of the end of discharge
        rather than at it [10]."
      on_violation: "NO_FLY — khong gi lat duoc"
      descent_rate_ms: 1.5
      descent_rate_source: >
        Rodrigues et al. (2021), Methods: "reaches the launch point again, the
        UAV stops and descends at approximately 1.5 m/s"
      conservative_assumption: >
        Cong suat khi ha canh lay BANG cong suat bay treo cung khoi luong. Thuc
        te ha canh toc do thap ton IT HON bay treo, vi canh quat thu lai mot
        phan nang luong tu luong khi di len. Nhung thieu he so can canh quat
        (xem physics_m100.MISSING) nen lay can bao thu — dung cach §5.4 yeu cau.
        Huong sai lech: UOC THUA nang luong ha canh -> than trong hon -> lech ve
        phia tu choi thua, khong phai cho bay nham.
      wording_rule: >
        Khi bao cao PHAI noi ro: NGUYEN TAC tu P§4.6 cua thay, nhung CON SO tinh
        tu mo hinh vat ly cua nhom voi eta khop tu MOT diem (thoi luong bay treo
        khong tai do DJI cong bo). Khac han HR-1..HR-4 la so DJI in ra giay.
        Thay se hoi "con so nay o dau ra" — phai tra loi duoc ngay.
      not_to_be_confused_with: >
        Day KHONG phai nang luong ha canh BINH THUONG o cuoi chuyen. Cai do da
        nam trong E_required (quyet dinh B9, xem
        energy_required.budget_conventions). PH-1 la SAN cho SoC, ap dung cho
        tinh huong phai huy chuyen giua duong va dap gap.
      binding_analysis: >
        Tren 192 chuyen cua bo du lieu, PH-1 gan nhu KHONG kich hoat: no doi
        SoC 2.5-11.9 % (ho so CMU_instrumented, tai 0-500 g, cao 25-100 m),
        trong khi luat du tru da doi trung vi 26.5 % va lon nhat 42.0 %.
        Luat du tru nghiem hon.
        PH-1 chi thang khi E_required NHO ma do cao CAO — vi luat du tru ti le
        voi E_required con PH-1 la so tuyet doi. Vi du: chuyen can 8 Wh, cao
        100 m, tai 500 g -> luat du tru doi SoC 10.2 %, PH-1 doi 11.9 %.
        Bo sinh kich ban o san pham D4 SE sinh ra loai nay, vi no quet doc lap
        cu ly va do cao. Thieu PH-1 thi nhung kich ban do cho FLY sai.
      kappa_warning: >
        min_soc_for_landing() mac dinh kappa = 1.0, tuc cho NGUONG LAC QUAN.
        Ai dung ham do de quyet dinh PHAI truyen kappa THAT. Vi du: o 0 C thi
        kappa = 0.9203 nen nguong that cao hon mac dinh 8.66 %.
        Bang reports/d3_landing_energy.csv dung mac dinh, nen phai doc la
        "nguong toi thieu o dieu kien tot nhat", KHONG phai nguong van hanh.
        Co test canh: test_nguong_mac_dinh_la_nguong_LAC_QUAN.
      code_ref: "src/safety_invariants.py -> _kiem_ha_canh()"
      naming_rule: >
        Ma la PH-1 chu KHONG phai HR-5. Tien to HR- trong repo danh rieng cho
        luat co so la SO DJI CONG BO, va co test canh
        (test_moi_luat_hr_co_ghi_nguon kiem moi luat HR-* phai co "DJI" trong
        nguon). PH-1 co NGUYEN TAC tu thay nhung CON SO tu nhom, nen mang ma
        rieng.
      reference_table: "reports/d3_landing_energy.csv (sinh boi src.physics_m100)"

  # 4.2 — Gioi han do NHOM phat hien, KHONG phai cua nha san xuat
  project_derived:
    - id: "PD-1"
      check: "420 <= distance_2d_m <= 610"
      source: "thi nghiem E2c cua nhom (bo sung ngoai giao thuc thay)"
      on_violation: "khong duoc tra FLY; ha xuong CONDITIONAL kem nhan EXTRAPOLATED"
      wording_rule: >
        Khi bao cao phai noi ro day la gioi han RUT RA TU THI NGHIEM CUA NHOM,
        khong phai gioi han nha san xuat. Hai loai co nguon goc khac nhau va
        thay se hoi "nguong nay o dau ra".
      labelling_ref: "§6/E3: 'clearly label any extrapolated ranges'"
    - id: "PD-2"
      check: "0 <= payload_g <= 500"
      source: "do phu bo du lieu CMU (reports/parameter_table.md muc 5)"
      on_violation: "khong duoc tra FLY; ha xuong CONDITIONAL kem nhan EXTRAPOLATED"
      rationale: >
        Thay cho luat MTOW o ho so CMU_instrumented. Bo du lieu chi phu 0-500 g;
        tren 500 g la ngoai suy, mo hinh nang luong khong co du lieu do lung.

  # 4.3 — SoC toi thieu — SAN AN TOAN KHI CO SU CO
  minimum_soc:
    principle: >
      §4.6: dat gioi han an toan TRUOC khi het phong dien, khong phai TAI diem
      het phong dien (theo Zhang et al. [10]).
    definition: >
      SAN AN TOAN KHI CO SU CO: SoC toi thieu de con ha canh duoc neu phai HUY
      CHUYEN GIUA DUONG, tu do cao hanh trinh.
    not_to_be_confused_with: >
      KHAC HAN nang luong ha canh BINH THUONG o cuoi chuyen. Cai do DA NAM
      TRONG E_required — xem energy_required.budget_conventions muc (2).
      Cong them mot lan nua la DEM HAI LAN.
      San nay la cho tinh huong BAT THUONG: dang bay nua duong, phai dap gap.
    status: "DA CAI — luat PH-1, xem hard_rules.physics_derived"
    implemented_in: >
      src/physics_m100.py -> landing_energy_Wh(), min_soc_for_landing();
      src/safety_invariants.py -> PH-1 (_kiem_ha_canh)
    resolution_note: >
      KHONG phai viec cho thay quyet. P§4.6 da chon san cach lam: "set so that
      the aircraft retains the energy required to land from its cruise
      altitude". Viec cua nhom chi la TINH va CAI DAT. Nhom tung tuong day la
      viec can hoi — tra lai P§4.6 thi thay da co san cau tra loi.
    does_not_block_acceptance: >
      Da doi chieu bang tieu chi nghiem thu Muc 12.1 cho san pham D3: KHONG co
      tieu chi nao doi luat SoC toi thieu. D3 van dat 13/13 khi chua co luat
      nay. Day la viec BO SUNG, khong phai loi phai va.

# -----------------------------------------------------------------------------
# 5. BIEN DU TRU VA PHAN QUYET (khoi c, e)
# -----------------------------------------------------------------------------
reserve_and_verdict:
  source_ref: "§5.6, §5.7, P§4.5"

  formulas:
    margin_absolute_Wh: "M = E_available - E_required"
    margin_ratio: "R = (E_available - E_required) / E_required"

  reserve_factor:
    primary: 0.20
    sweep: [0.10, 0.20, 0.30]
    source: "P§4.5, theo Zhang et al."
    status: "THAM SO CHINH SACH"
    wording_rule: >
      §5.7 nguyen van: he so du tru 1.20 co the thu nhu MOT GIA DINH KICH BAN,
      "but not presented as a regulatory or manufacturer requirement."
    reporting_rule: >
      BAT BUOC bao ket qua tren CA BA muc 0.10 / 0.20 / 0.30. P§4.5: "a finding
      that holds only at one arbitrary reserve setting is not a finding about
      the method."
    does_not_cover: >
      r KHONG bao gom hai khoan sau — ghi ro de khong dem hai lan:
        (a) nang luong cat canh va ha canh -> nam trong E_required, xem
            energy_required.budget_conventions muc (2), quyet dinh B9;
        (b) sai so du bao cua mo hinh -> nam trong nguong tren R_fly, xem
            thresholds duoi day, quyet dinh B4.

  thresholds:
    decision_ref: "B4"
    lower: "R_min = r"                                  # mac dinh 0.20
    upper: "R_fly = r + p95_abs_residual_Wh / E_required"
    rationale: >
      He so du tru r chong RUI RO VAN HANH (gio, vong cho, sai lech tuyen).
      No KHONG chong SAI SO DU BAO cua chinh mo hinh — do la rui ro rieng,
      phai cong rieng. Khoan cong them lay tu phan vi 95 cua |phan du| out-of-fold
      cua D2-b = 1.4687 Wh, dung cach §4.7 chi: "a documented uncertainty
      allowance" rut tu phan du do duoc, khong phai tu chinh mo hinh.
    worked_example:
      E_required_Wh: 21.27           # trung binh 192 chuyen
      r: 0.20
      R_min: 0.200
      R_fly: 0.269                   # 0.20 + 1.4687/21.27
      note: "nguong tren phu thuoc tung chuyen, vi khoan cong them la Wh tuyet doi"

  verdicts:
    count: 4
    source_ref: "§5.7 (ba muc) + §4.6 (muc thu tu, fail closed)"
    levels:
      - id: "FLY"
        condition: "R >= R_fly VA khong vi pham luat cung VA du dau vao"
      - id: "CONDITIONAL"
        condition: "R_min <= R < R_fly VA khong vi pham luat cung VA du dau vao"
        meaning: "bay duoc nhung phai co nguoi duyet; nen kem ly do"
      - id: "NO_FLY"
        condition: "R < R_min HOAC vi pham bat ky luat cung nao"
      - id: "INSUFFICIENT_DATA"
        condition: "thieu / khong hop le / ngoai dai / het han bat ky dau vao an toan nao"

  conditional_mitigation:
    decision_ref: "B8"
    source_ref: "Muc 12.1 (D3): 'conditional verdicts require an explicit
                 mitigation'; §2.3"
    quote: >
      "CONDITIONAL / DEGRADED is actionable only when an approved mitigation is
      selected and the scenario is re-evaluated where the mitigation changes
      energy demand or constraints."
    rule: >
      CONDITIONAL khong kem bien phap -> actionable = False. Phan quyet van la
      CONDITIONAL (giu thong tin), nhung KHONG duoc tien hanh nhiem vu cho toi
      khi chon mot bien phap va DANH GIA LAI.
    validity_conditions:
      - "bien phap phai doi NHU CAU NANG LUONG hoac RANG BUOC — khong duoc la
         loi hua suong kieu 'can than hon khi bay'"
      - "bien phap phai THUC SU cai thien phan quyet khi ap dung (INV-7)"
    catalogue_ref: "src/mitigations.py"
    groups:
      A: "doi nang luong kha dung hoac rang buoc — tinh duoc ngay (M1-M4)"
      B: "doi nhu cau nang luong — phai du bao lai bang mo hinh D2 (M5-M7)"
    estimator_rule: >
      Nhom B doi E_required nen BAT BUOC du bao lai. Ham du bao truyen tu ngoai
      vao, D3 KHONG duoc tu import mo hinh (INV-6). Khong co ham du bao thi nhom
      B bi bo qua va BAO RO trong ket qua, khong im lang.

  fail_closed:
    source_ref: "§4.6"
    quote: >
      "The layer also fails closed. A missing, invalid, out-of-range or stale
      safety-critical input does not fall back to a favourable default; it
      produces NO-FLY or an explicit insufficient-data outcome."
    decision_ref: "B5"
    rule: |
      thieu dau vao        -> INSUFFICIENT_DATA
      dau vao sai/ngoai dai -> NO_FLY
      dau vao het han       -> INSUFFICIENT_DATA (phai tinh lai)
    prohibition: >
      TUYET DOI khong tu dien gia tri mac dinh roi chay tiep. Mot man hinh bao
      FLY mau xanh trong khi he thong vua tu bia mot con so la che do hong
      nguy hiem nhat cua ca he thong.

# -----------------------------------------------------------------------------
# 6. QUAN TRANG THAI VA HET HAN (khoi f)
# -----------------------------------------------------------------------------
workflow_state:
  source_ref: "P§4.2"
  version_fields:
    - "model_version"
    - "threshold_version"
    - "aircraft_profile_version"
    - "safety_rules_version"
  freshness_rule: >
    Khi BAT KY dau vao an toan, ke hoach nhiem vu, lua chon may bay/pin, nguong
    hay chinh mo hinh thay doi -> danh gia truoc do bi danh dau STALE va PHAI
    duoc tinh lai truoc khi nhiem vu duoc phep tien hanh.
  outcome_field:
    rule: >
      Truong ket cuc duoc ghi DOC LAP voi khuyen nghi, va co the la "khong biet",
      de danh gia ve sau khong bao gio dung chinh phan quyet cua he thong lam
      su that nen (P§4.2).
  replay_property:
    requirement: >
      Cho mot ban ghi da luu va cac tham so nen tang da cong bo, phan quyet phai
      TINH LAI DUOC CHINH XAC. Day la tinh chat RQ4 khang dinh.
    note: "San pham D6 kiem tinh chat nay day du; D3 chi phai khong pha vo no."

# -----------------------------------------------------------------------------
# 7. KIEM D3 BANG GI — bat bien, khong phai do chinh xac
# -----------------------------------------------------------------------------
# Khong co dap an "chuyen nay dang le co nen bay khong", nen KHONG do duoc do
# chinh xac o D3. Thay vao do kiem cac TINH CHAT phai luon dung.
invariants:
  source_ref: "§4.6, P§4.2 (workflow invariants, Thi nghiem 5)"
  tests:
    - id: "INV-1"
      name: "luat cung phu quyet"
      statement: "vi pham bat ky luat cung nao -> KHONG BAO GIO ra FLY"
      method: "quet moi to hop vi pham, ke ca khi R rat lon"
    - id: "INV-2"
      name: "fail closed"
      statement: "thieu bat ky dau vao an toan nao -> KHONG BAO GIO ra FLY"
      method: "lan luot bo tung dau vao"
    - id: "INV-3"
      name: "don dieu theo nang luong"
      statement: "E_available tang (giu nguyen moi thu khac) -> phan quyet khong bao gio xau di"
      method: "quet SoC tu 0 den 1, kiem thu tu phan quyet"
    - id: "INV-4"
      name: "tat dinh"
      statement: "cung dau vao -> cung dau ra, moi lan chay"
      method: "chay lai 100 lan, so khop tung bit"
    - id: "INV-5"
      name: "tinh lai duoc"
      statement: "luu ban ghi roi tinh lai -> ra DUNG phan quyet cu"
      method: "serialize -> deserialize -> tinh lai -> so"
    - id: "INV-6"
      name: "khong co mo hinh hoc may trong D3"
      statement: "D3 khong goi .fit() o bat ky dau"
      method: "kiem tinh tren ma nguon"
    - id: "INV-7"
      name: "bien phap giam thieu phai co tac dung"
      statement: "moi bien phap duoc de xuat PHAI cai thien phan quyet khi ap dung"
      method: "propose() chay thu tung bien phap truoc khi de xuat; test quet
               moi nhiem vu trong 192 chuyen"
      rationale: >
        De xuat mot bien phap khong doi duoc gi la lua nguoi dung. Va mot danh
        sach bien phap khong bao gio duoc kiem thi som muon se chua rac.
    - id: "INV-8"
      name: "khong du pin ha canh thi khong bao gio FLY"
      statement: "e_available < landing_energy(altitude, mass) -> KHONG BAO GIO ra FLY"
      method: "quet do cao 25/50/75/100 m x tai 0/250/500 g x SoC duoi nguong;
               kiem moi truong hop vi pham PH-1 deu ra NO_FLY. Kiem them mot
               chieu nua: PH-1 la VETO nen bien phap giam thieu KHONG lat duoc."
      rationale: >
        Khai mot luat trong giao thuc roi khong kiem thi vo nghia — giong INV-6.
        Va neu khong khoa chieu bien phap thi M1 (sac them pin) se thanh cua sau
        de lach PH-1, dung loi ma mitigations.py da co test chan cho HR-1.

# -----------------------------------------------------------------------------
# 8. NHUNG DIEU KHONG DUOC LAM
# -----------------------------------------------------------------------------
prohibitions:
  - "Khong huan luyen lai hoac tinh chinh mo hinh D2 trong D3"
  - "Khong huan luyen du bao SoH tren bo du lieu nay (§4.3)"
  - "Khong dua nhiet do vao mo hinh du bao nang luong CAN — nhiet do chi vao
     kappa(T) cua nang luong KHA DUNG"
  - "Khong noi du lieu thoi tiet cong cong vao 192 chuyen bay lich su (§4.4) —
     xem open_items OI-D3-2"
  - "Khong goi bat ky dau ra nao cua D3 la 'xac suat' hay 'do tin cay' (§5.6, §5.8)"
  - "Khong gop vi pham luat cung vao mot diem so (§5.6)"
  - "Khong dien gia tri mac dinh thay cho dau vao thieu (§4.6)"
  - "Khong bao ket qua chi o mot muc he so du tru (P§4.5)"
  - "Khong coi CONDITIONAL la thuc thi duoc khi chua chon bien phap (Muc 12.1)"
  - "Khong de xuat bien phap ma khong chay thu truoc (INV-7)"
  - "Khong noi 'cu ly' ma khong noi ro mot chieu hay khu hoi (Muc 12.1)"
  - "Khong goi nhan kich ban la 'ground truth' hay 'flight outcomes' (§4.7)"
  - "Khong cong them nang luong ha canh vao E_required, va khong nang r de bu
     cho ha canh — DEM HAI LAN (P§4.5, quyet dinh B9)"

# -----------------------------------------------------------------------------
# 9. VIEC CON TREO
# -----------------------------------------------------------------------------
open_items:
  - id: "OI-D3-1"
    item: >
      DA DONG 20/10/2026 — cai thanh luat PH-1, xem quyet dinh B10.
      P§4.6 da chon san cach lam ("set so that the aircraft retains the energy
      required to land from its cruise altitude"), nen khong co gi phai hoi
      thay; viec cua nhom la TINH va CAI DAT.
      Con so (ho so CMU_instrumented, toc do ha 1.5 m/s):
        tai 0 g   -> 25 m: 2.46 Wh | 50 m: 4.93 Wh | 75 m: 7.39 Wh | 100 m: 9.86 Wh
        tai 500 g -> 25 m: 2.98 Wh | 50 m: 5.97 Wh | 75 m: 8.95 Wh | 100 m: 11.93 Wh
      Bang day du: reports/d3_landing_energy.csv
    owner: "Phat"
    status: "DONG"
    blocks: null
  - id: "OI-D3-2"
    item: >
      DA XET VA BAC BO: dung API thoi tiet (Open-Meteo / NASA POWER) de tra nhiet
      do lich su cho 192 chuyen. §4.4 noi ro du lieu thoi tiet cong cong "may be
      used ONLY as an optional extension for realistic scenario ranges" va "must
      NOT be joined to historical flights unless flight dates, locations, and
      time alignment are sufficiently documented". Cau ket luan: "For the core
      project, use transparent parameter ranges and report them instead of adding
      an unverified weather join."
      => Ghi lai de khong ai de xuat lai. Neu sau nay muon dung, chi duoc dung
      cho DAI nhiet do cua kich ban D4, khong noi vao tung chuyen bay.
    owner: "Phat"
    status: "DONG — khong lam"
  - id: "RS-3"
    item: >
      Tong distance_2d_m cua 192 chuyen = 92.8 km; bai Rodrigues ghi bo du lieu
      phu "approximately 65 kilometres" cho 209 chuyen — lech ~43 %. Hai kha
      nang: bai tinh theo tuyen danh nghia con nhom tinh theo quy dao GPS that;
      HOAC phep cong haversine theo tung mau cong don ca NHIEU GPS luc treo,
      lam phong cu ly. Kha nang thu hai dang lo hon va kiem duoc: so voi khoang
      cach duong thang giua cac diem moc, hoac loc cac buoc nho hon nguong nhieu.
      Chua ket luan gi. Anh huong cach doc envelope o B7.
    owner: "Phat"
    blocks: null
  - id: "OI-D3-3"
    item: >
      Duy xac nhan vai kiem cheo WP3 (xem d2_protocol.yaml OI-6). Can doc
      reports/parameter_table.md truoc tuan 7.
    owner: "Phat"
    blocks: "nghiem thu D3 theo Muc 12.1"

# -----------------------------------------------------------------------------
# 10. NHAT KY THAY DOI
# -----------------------------------------------------------------------------
change_log:
  - version: "1.0.0"
    date: "2026-10-14"
    author: "Phat"
    changes: "Ban dong bang dau tien cho san pham D3."
    decisions:
      - id: "B3"
        question: "kappa(T) ngoai dai hieu chinh cua Kim thi dung gia tri nao?"
        resolution: >
          Kep MOT PHIA: T < 4.5 C -> giu o poly(4.5) = 0.9203; T > 18.4 C -> 1.0.
        basis: >
          Quy tac cu (kappa = 1 ngoai moi dai) sai o phia lanh — tai 4.4 C nhay
          tu 0.920 len 1.000, tuc cang lanh cang gia dinh pin cang khoe, lam
          E_available tinh THUA theo huong nguy hiem. Quy tac moi khong ngoai suy
          (§5.4 cam), lien tuc, va bao thu.
        affects: "reports/parameter_table.md muc 2 — PHAI sua theo"
      - id: "B4"
        question: "ba muc phan quyet can hai nguong, thay chi cho mot con so r = 0.20"
        resolution: >
          R_min = r. R_fly = r + p95(|phan du|)/E_required = r + 1.4687/E_required.
        basis: >
          r chong rui ro van hanh, khong chong sai so du bao cua mo hinh — hai
          rui ro khac nhau, phai cong rieng. Khoan cong them lay tu phan vi 95
          cua |phan du| out-of-fold cua D2-b, dung cach §4.7 chi ("a documented
          uncertainty allowance" rut tu phan du do duoc, khong phai tu chinh
          mo hinh). Day la cho ket qua D2 thuc su chay vao D3.
      - id: "B5"
        question: "thieu SoC / SoH / nhiet do thi xu ly sao?"
        resolution: >
          Fail closed theo dung §4.6: thieu -> INSUFFICIENT_DATA; sai hoac ngoai
          dai -> NO_FLY; het han -> INSUFFICIENT_DATA. Them muc phan quyet thu tu.
        basis: >
          §4.6 nguyen van: "does not fall back to a favourable default; it
          produces NO-FLY or an explicit insufficient-data outcome".
          De xuat ban dau cua nhom (thieu -> cao nhat CONDITIONAL) KHONG dat,
          vi CONDITIONAL van la mot dang cho bay, tuc van la favourable default.
        note: >
          §4.6 them mot tu ban dau nhom chua tinh: STALE (dau vao het han).
          Dan toi muc 6 workflow_state.


  - version: "1.1.0"
    date: "2026-10-14"
    author: "Phat"
    changes: >
      Them muc 3b (ho so may bay) va luat PD-2. KHONG doi cong thuc, nguong hay
      ket qua nao — chi lam ro cach ap HR-3, truoc do chua dinh nghia du.
    decisions:
      - id: "B6"
        question: >
          HR-3 (khoi luong cat canh <= 3600 g) ap the nao, khi may bay trong bo
          du lieu nang 3680-4180 g va vuot MTOW o MOI cau hinh?
        resolution: >
          Tach hai ho so. M100_stock (khung 2355 g) la ho so VAN HANH, HR-3 veto
          binh thuong. CMU_instrumented (khung 3680 g) dung khi chay lai 192
          chuyen cua bo du lieu: HR-3 bao KNOWN_EXCEEDED, khong veto; thay bang
          luat PD-2 (tai 0-500 g theo do phu du lieu).
        basis: >
          reports/parameter_table.md muc 3.1 da khuyen dung dung cach nay.
          Veto thi 192/192 chuyen NO_FLY, khong con gi de do. Bo HR-3 di thi mat
          mot rang buoc an toan that. Tach ho so giu duoc ca hai.
        must_state_in_paper: >
          Toan bo 192 chuyen vuot MTOW nha san xuat. Day la han che cua bo du
          lieu, phai neu ro, khong duoc im lang.

  - version: "1.2.0"
    date: "2026-10-15"
    author: "Phat"
    changes: >
      Vá hai thieu sot phat hien khi ra soat doi chieu Muc 12.1. KHONG doi cong
      thuc, nguong hay ket qua nao da cong bo — cac bang trong reports/ giu
      nguyen, khong phai chay lai.
    decisions:
      - id: "B7"
        question: "cu ly trong bo du lieu la mot chieu hay khu hoi?"
        resolution: >
          KHU HOI (vong kin tam giac, quay ve diem cat canh). Khai bao ro trong
          giao thuc, data_dictionary va bao cao. Envelope dien giai theo HAI cach
