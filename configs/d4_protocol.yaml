  - version: "1.0.11"
    date: "2026-10-23"
    author: "Phat"
    changes: >
      Ghi lai HAI PHAT HIEN tu lan chay cham diem dau tien (C26), va them hai
      bang bat buoc de chung khong bi doc nham.
      KHONG doi mot con so nao: a = 1.2924 va b = 1.4687 da dong bang va co
      nguoi ky. Chinh chung sau khi thay ket qua la dung dieu ma ca file nay
      dung de chan.
    decisions:

      - id: "C26"
        question: >
          Lan chay cham diem dau tien cho M-4 (ty le tu choi thua) bang DUNG 0
          cho B1, B3 va B5-noHR, va bang 0.7186 cho B5. Hai con so do co phai
          ket qua do duoc khong?
        resolution: >
          KHONG, ca hai deu phai kem giai thich, va them hai bang:
            reports/d4_structural_relation.csv
            reports/d4_b5_rejection_causes.csv

        phat_hien_1: >
          M-4 = 0 la TAT YEU VE DAI SO, khong phai do duoc.
          Nhan REF-1 goi mot kich ban la kha thi khi
              E_av >= (1+r)(E_pred + a),  a = 1.2924
          Khi do bien du tru cua HE THONG (dung E_pred, khong cong a) thoa
              R_sys >= r + (1+r)*a / E_pred
          con nguong FLY la
              R_fly  = r + b / E_pred,    b = 1.4687
          Ma (1+r)*a = 1.5509 > b = 1.4687, nen R_sys > R_fly LUON LUON.
          => Moi kich ban nhan goi la kha thi deu tu dong vuot nguong FLY, va
             bac giua CONDITIONAL KHONG THE bi tinh la tu choi thua.
          Bien cua bat dang thuc chi 0.0822 Wh; doi dau khi a < 1.2239.
        he_qua_1: >
          CAM viet "bac giua cai thien an toan ma khong ton them tu choi". Cau
          do dung theo CAU TAO, khong phai theo bang chung. Dong gop that cua
          bac giua (B3 -> B5-noHR: false-safe 0.0754 -> 0.0046) van la ket qua
          do duoc va bao duoc; chi phan "khong ton them" la khong.
          Cho danh doi THAT xuat hien la duong quet he so du tru: nhan giu
          r = 0.20 con he thong quet 0.10-0.30, nen khi he thong chat hon nhan
          thi tu choi thua moi hien ra.

        phat_hien_2: >
          M-4 cua B5 = 0.7186 phan lon KHONG phai quyet dinh nang luong.
          12965/18000 kich ban nam ngoai envelope cu ly 420-610 m, va luat
          PD-1/PD-2 ha FLY xuong CONDITIONAL, roi CONDITIONAL tinh la khong
          duyet (C24). Tinh lai: main ngoai envelope 68.3 % x 12600 +
          short_high 2100 = 10706/14700 = 72.8 %, khop 0.7186.
        he_qua_2: >
          Doc nguyen con so thanh "B5 tu choi thua 72 %" la SAI HAN. Dung la:
          B5 gan co NGOAI VUNG HIEU LUC cho 72 % kich ban — chinh la viec no
          duoc thiet ke de lam (§5.7). Bang d4_b5_rejection_causes.csv tach
          rieng tung nguyen nhan de con so nay khong the bi doc nham.

        khong_duoc_sua_bang_cach: >
          CAM chinh a, b, hay r de M-4 "co y nghia hon". Hai con so do da dong
          bang, co nguoi ky, va viec chinh tham so sau khi thay ket qua la dung
          dinh nghia gian lan ma giao thuc nay dung de chan. Cach dung la BAO
          RA, va chi vao cho danh doi that su ton tai.

        must_state_in_paper: >
          Hai cau, bat buoc:
          (1) "Ty le tu choi thua bang 0 doi voi mot so duong co so la he qua
              dai so cua viec nhan tham chieu bao thu hon he thong mot khoan
              lon hon chinh khoan bat dinh cua he thong; khong phai ket qua do
              duoc."
          (2) "Phan lon ty le tu choi cua phuong phap de xuat den tu co ngoai
              suy, khong tu quyet dinh nang luong."
