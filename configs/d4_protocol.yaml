          tach rieng.
        consequence_for_M7: >
          Thuoc do M-7 ("so vi pham luat cung bi duyet sai, muc tieu 0") bang 0
          cho MOI phuong phap o bang chinh — theo thiet ke, khong phai thanh
          tich. No chi co y nghia o bang thu hai va o ablation B5-noHR. Phai
          viet ro cau nay trong bao cao, neu khong "0 vi pham" doc nhu mot ket
          qua trong khi no la mot hang so.

      - id: "C24"
        question: >
          B0..B3 co bac phan quyet giua (CONDITIONAL) khong?
        resolution: >
          KHONG. B0..B3 la quy tac NHI PHAN — duyet hoac tu choi, dung mo ta Muc
          7. Chi B5 co bac giua.
        basis: >
          Bac giua CHINH LA dong gop cua phuong phap nhom (§5.7: "three-level
          advisory verdict"). Cho B0..B3 muon bac giua la xoa mat thu dang do.
          Nen confusion matrix BA LOP (M-6) chi ap cho B5; M-5 nhi phan ap cho
          tat ca.
        when_mapping_B5_to_binary: >
          CONDITIONAL tinh la KHONG duyet bay, vi §2.3 noi no chua thuc thi duoc
          khi chua co bien phap. Bao them bang voi cach gop nguoc lai — cung
          tinh than do nhay S-3.

