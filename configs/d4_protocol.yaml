        basis: >
          Chi ap cho B5 thi B0 se duyet bay mot kich ban gio 15 m/s, va B5 thang
          khong phai vi quyet dinh nang luong tot hon ma vi doi thu khong co lop
          an toan. Do la doi thu bu nhin — Muc 7 co cot "fairness condition"
