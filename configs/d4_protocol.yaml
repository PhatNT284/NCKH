  - version: "1.0.1"
    date: "2026-10-20"
    author: "Phat"
    changes: >
      Sua HAI loi cau truc cua ban 1.0.0, phat hien khi viet
      src/scenario_generator.py — tuc TRUOC KHI sinh kich ban dau tien va truoc
      khi thay bat ky con so ket qua nao. Khong doi dai lay mau nao cua tang
      `main`, khong doi thuoc do, khong doi dinh nghia nhan.
      Chia bon tang (C9) va tach GEN-4 (C10).
    decisions:

      - id: "C9"
        question: >
          Ban 1.0.0 doi >= 500 kich ban vi pham luat cung (COV-1), nhung dai lay
          mau lai nam TRONG gioi han (tai <= 500 g, toc do <= 12, gio <= 10) va
          dieu cam con chan them. Hai yeu cau tu danh nhau. Xu ly sao?
        resolution: >
          Chia bo kich ban thanh BON TANG. Tang `hard_rule_probe` (700 kich ban)
          CO Y vuot gioi han, va bi LOAI khoi bang so sanh chinh. Dieu cam
          "khong lay mau ngoai dai" duoc thu hep lai cho tang `main` va
          `short_high` — dung cho no cam ca tang probe.
          Tang `missing_input` (400) cung loai khoi bang chinh.
          Phan bo: main 4200 + probe 700 + short_high 700 + missing 400 = 6000,
          giu dung tong cua C2.
        basis: >
          Thuoc do M-7 ("so vi pham luat cung bi duyet sai, muc tieu 0") can
          dung loai kich ban vuot gioi han. Khong co tang probe thi M-7 do tren
          0 truong hop, tuc bao "dat muc tieu 0" ma khong chung minh gi — dung
          cai loi ma bat bien INV-6 cua D3 da canh.
          Nhung tron tang probe vao bang chinh thi sai chieu nguoc lai: kich ban
          gio 16 m/s thi MOI phuong phap deu tu choi, nen B0 va B1 se trong khoe
          len mot cach gia. Hai tang, hai bang.
        found_how: >
          Phat hien khi viet ham kiem _gen4a(): dem thu thi thay se ra 0 vi pham
          luat cung. Neu khong viet ham kiem truoc khi sinh, loi nay se im lang
          — bang M-7 van in ra "0 vi pham", van dung chu nghia, va khong ai biet
          no do tren 0 truong hop.

      - id: "C10"
        question: >
          Ban 1.0.0 bat GEN-4 kiem ca bon yeu cau do phu, trong do COV-3 la
          "nam trong vung bien". Nhung vung bien dinh nghia theo R = M /
          E_required, ma E_required la dau ra mo hinh — bo sinh khong co. Kiem o
          dau?
        resolution: >
          Tach GEN-4 thanh GEN-4a (COV-1, COV-2, COV-4 — bo sinh tu kiem) va
          GEN-4b (COV-3 — kiem o buoc gan nhan). Them truong `verified_at` cho
          moi phep kiem, va `verified_by` cho moi yeu cau do phu.
        basis: >
          Bo sinh KHONG DUOC biet dau ra cua mo hinh. Neu biet, no co the nan
          dai kich ban theo cho mo hinh lam tot — mot dang ro ri nguoc, va
          khong ai phat hien duoc tu ket qua. Nen dua E_required vao bo sinh de
          kiem COV-3 la duoi sai huong; dung cach la hoan phep kiem lai mot buoc.
        guard: >
          Neu sau khi gan nhan ma COV-3 khong dat: CAM sua dai kich ban de chay
          theo cho du. Phai nang `n_scenarios` va ghi vao change_log — vi sua
          dai sau khi da biet R la dung dinh nghia "doi tham so sau khi thay ket
          qua".

  - version: "1.0.2"
    date: "2026-10-20"
    author: "Phat"
    changes: >
      Sua DAU cua phan du trong cong thuc REF-1 — ban 1.0.1 ghi nguoc. Chot
      khoan du phong bat dinh = 1.2924 Wh va dong OI-D4-3. Quyet dinh C11.
