    - id: "GEN-2"
      statement: "moi kich ban nam trong dai khai bao CUA TANG CUA NO"
      method: "kiem tung cot theo `variables` + `range_overrides` cua tang"
      verified_at: "generator"
    - id: "GEN-3"
      statement: "co ngoai suy duoc dat dung"
      method: "tinh lai co tu gia tri, so voi cot da luu"
      verified_at: "generator"
    - id: "GEN-4a"
      statement: "do phu COV-1, COV-2, COV-4 duoc dap ung"
      method: "dem tren bo da sinh; THIEU thi ban loi, khong canh bao suong"
      verified_at: "generator"
    - id: "GEN-4b"
      statement: "do phu COV-3 (vung bien) duoc dap ung"
      method: "dem sau khi gan nhan, vi vung bien can R = M/E_required"
      verified_at: "labeller"
    - id: "GEN-5"
      statement: "bo kich ban KHONG chua cot nang luong nao"
      method: >
        kiem khong co cot ten chua `_Wh` hay `energy`. Bo sinh khong duoc sinh
        san E_required: neu co, se co nguoi cong them khoan ha canh vao do —
        dung cai loi ma quy uoc B9 cua D3 dung de chan.
      verified_at: "generator"
    - id: "GEN-6"
      statement: "nhan tham chieu khong dung fold kiem cuoi"
      method: "kiem tinh tren ma nguon + kiem nguon file phan du"
      verified_at: "labeller"
  rule: >
    Danh sach nay doc tu giao thuc, KHONG duoc viet cung trong code hay test.
    Loi lech danh sach bat bien da xay ra BA LAN o san pham D3, lan nao cung im
    lang. Lam dung tu dau o D4.

