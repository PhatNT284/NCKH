change_log:
  - version: "1.0.0"
    date: "2026-10-20"
    author: "Phat"
    changes: "Ban dong bang dau tien cho san pham D4."
    decisions:

      - id: "C1"
        question: "quyet dinh thiet ke cua D4 danh so the nao de khong dam vao B0-B5?"
        resolution: "tien to C (C1, C2, ...). B danh rieng cho duong co so Muc 7."
        basis: >
          d3_protocol.yaml da dung B3-B10 cho quyet dinh thiet ke, va Muc 7 dung
          B0-B5 cho duong co so. Hai he da trung nhau mot lan. Khong lam trung
          lan thu ba.

      - id: "C2"
        question: "6000 kich ban hay 5000?"
        resolution: "6000."
        basis: >
          §6/E3 doi "at least 5,000". Lay 6000 de con cho cho bon yeu cau do phu
          COV-1..COV-4 ma khong phai sinh bu, va de phan vung bien du dong de
          do rieng.

      - id: "C3"
        question: "mot seed hay nhieu seed?"
        resolution: >
          MOT seed = 42. Neu bao do on dinh theo seed thi phai bao ca ba
          42/43/44 day du, cung luc.
        basis: >
          Nhieu seed ma khong khai truoc la cua sau kinh dien: chay 20 lan, bao
          lan dep. Khai truoc thi khong lach duoc.

      - id: "C4"
        question: "lop `marginal` cua nhan tham chieu gop vao dau khi tinh nhi phan?"
        resolution: >
          Mac dinh gop vao `infeasible` (bao thu). NHUNG bat buoc bao them mot
          bang voi cach gop nguoc lai — do nhay S-3.
        basis: >
          Cach gop quyet dinh truc tiep con so false-safe. Chon mot cach roi im
          lang la che mat nua su that; bao ca hai thi nguoi doc tu danh gia.

      - id: "C5"
        question: "duong co so B4 (mo hinh vat ly) co vao xep hang khong?"
        resolution: "KHONG. Loai, ghi ro ly do."
        basis: >
          Muc 7 cho B4 dieu kien "only quantitative if M100 parameters are
          documented", va bang kiem §3.2 da ket luan khong du tham so (thieu
          P_bl, P_par). Giu nhat quan voi cach da xu ly mo hinh D5 o san pham
          D2. Muc 12.1 cung chi doi B0/B1/B2/B3/B5.
        note: >
          Mo hinh vat ly VAN co vai: sinh nhan tham chieu REF-2 va cap
          landing_energy_Wh() cho PH-1. Loai khoi xep hang khong co nghia la bo.

      - id: "C6"
        question: "lay mau cu ly trong envelope hay ra ngoai?"
        resolution: "[300, 900] m — CO Y ra ngoai envelope 420-610, co danh dau."
        basis: >
          Thi nghiem E2c da do duoc huong lech ngoai envelope (bias -7.6 Wh o
          835 m), nen con so ngoai suy doc duoc chu khong phai doan bua. Va neu
          chi lay mau trong envelope thi luat PD-1 khong bao gio kich hoat, tuc
          khong do duoc mot phan lop luat cua D3.
        impact: "phai bao ket qua rieng cho hai vung trong/ngoai envelope"

      - id: "C7"
        question: "co bat bo sinh phai phu nhung vung nao khong?"
        resolution: "CO — COV-1..COV-4, va GEN-4 ban loi neu thieu."
        basis: >
          Lay mau uniform tren 7 chieu KHONG bao dam phu nhung vung quan trong
          nhat. Cu the: vung "ngan ma bay cao" la cho duy nhat PH-1 rang buoc
          hon luat du tru, va bo du lieu CMU co 0/192 truong hop nhu vay. Khong
