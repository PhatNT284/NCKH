      KHONG doi kich ban, khong doi nhan, khong doi thuoc do.
    decisions:

      - id: "C25"
        question: >
          Luat PD-1 va PD-2 (ngoai dai co du lieu do lung) la DOWNGRADE: ha FLY
          xuong CONDITIONAL. Phuong phap NHI PHAN khong co bac giua. Ap the nao?
        resolution: >
          KHONG ap cho B0..B3. Chi B5 va B5-noHR chiu DOWNGRADE.
          BAT BUOC bao so kich ban bi anh huong (ngoai envelope cu ly
          420-610 m) trong bang ket qua.
        basis: >
          Mot phuong phap nhi phan khong the "ha mot bac" vi no khong co bac
          nao de ha. Ep thanh NO_FLY la nang DOWNGRADE len thanh VETO — sai muc
          do, va lam B2/B3 bi phat nang hon muc Muc 7 mo ta.
          Bat doi xung nay la THAT: tren kich ban ngoai envelope, B2 va B3 ra
          FLY trong khi B5 ra CONDITIONAL. Do KHONG phai B5 kem hon — do chinh
          la dong gop cua no (§5.7): no biet mo hinh dang chay ngoai vung hieu
