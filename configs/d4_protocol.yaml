# =============================================================================
# GIAO THUC SAN PHAM D4 — BENCHMARK KICH BAN
# =============================================================================
# File nay DONG BANG truoc khi sinh kich ban dau tien va truoc khi xem bat ky
# ket qua nao. Doi sau khi da thay ket qua = chon tham so cho dep so, tuc gian
# lan. Moi lan doi phai ghi vao `change_log` kem ly do va NGAY.
#
# VI SAO PHAI DONG BANG — doc ky cho nay truoc khi lam gi:
#   San pham D4 la cho DUY NHAT trong de tai ma nhom tu sinh du lieu de tu cham
#   diem minh. D1 dung du lieu cua nguoi khac. D2 do bang cross-validation. D3
#   kiem bang bat bien chu khong bang diem so. Rieng D4: nhom tu sinh kich ban,
#   tu dinh nghia "dang le chuyen nay co nen bay khong", roi tu do xem he thong
#   minh dung bao nhieu phan tram. Ba vai do cung mot nguoi.
#   Bon thu duoi day KHONG ai phat hien duoc tu ben ngoai neu khong co file nay
#   ghi ngay dong bang:
#     - thay diem xau -> thu dai kich ban lai cho de -> diem dep
#     - chay 20 seed -> bao seed dep nhat
#     - noi dinh nghia nhan tham chieu cho khop he thong -> vong tron
#     - thay false-safe cao -> doi sang bao accuracy
#
# NGUON: §6/E3 (bo sinh kich ban, nhan tham chieu), Muc 7 (duong co so, thuoc
# do), Muc 12/12.1 (san pham va tieu chi nghiem thu), §4.7, P§4.9.
# -----------------------------------------------------------------------------

meta:
  deliverable: "D4 — Scenario benchmark (Muc 12)"
  experiment: "E3 — Pre-flight decision benchmark (§6)"
  research_question: "RQ2"
  version: "1.0.11"
  frozen_on: "2026-10-20"

  # ---------------------------------------------------------------------------
  # QUY UOC NGUON — moi con so trong file nay phai thuoc mot trong ba loai
  # ---------------------------------------------------------------------------
  provenance_rule: >
    Moi tham so so hoc trong file nay PHAI mang truong `source` thuoc mot trong
    ba loai:
      SUPERVISOR  — co trong file thay (§, Muc) hoac Proposal (P§). Trich duoc.
      MEASURED    — tinh tu du lieu trong repo. Chi duoc file CSV cu the.
      TEAM_CHOICE — nhom chon. PHAI kem `affects_results` va ly do.
    KHONG duoc co con so nao khong thuoc ba loai tren. Ban 1.0.0-1.0.2 co bon
    con so nhu vay; xem change_log 1.0.3.
  author: "Phat"
  cross_checker: "Duy"
  status: "DONG BANG — DU DIEU KIEN CHAY (OI-D4-1 da dong 21/10/2026)"
  depends_on:
    - "configs/d2_protocol.yaml v1.4.0 — mo hinh nang luong da chot"
    - "configs/d3_protocol.yaml v1.4.0 — nguong, luat cung, bien phap giam thieu"
    - "reports/d2_oof_residuals.csv — phan phoi phan du cho nhan tham chieu"
    - "reports/parameter_table.md muc 5 — dai nao co du lieu do lung"

  # ---------------------------------------------------------------------------
  # BA HE MA CUNG DUNG CHU CAI — KHONG DUOC TRON KHI TRICH DAN
  # ---------------------------------------------------------------------------
  naming_warning: >
    Co BA he ma rieng biet, de nham nhat trong ca de tai:
      (1) B0..B5  = DUONG CO SO QUYET DINH, Muc 7. Dung o file nay.
      (2) B3..B10 = QUYET DINH THIET KE cua san pham D3, trong d3_protocol.yaml.
      (3) D0..D5  = MO HINH du bao nang luong, §5.2.
    Trong file nay, quyet dinh thiet ke cua san pham D4 mang tien to `C` (C1,
    C2, ...) chu KHONG phai `B`, de khong dam vao (1). Khi viet bao cao phai ghi
    du: "duong co so B2", "quyet dinh C3", "mo hinh D2".
    Cho de sai nhat: B4 trong Muc 7 la MO HINH VAT LY, khong phai mot nguong.

# -----------------------------------------------------------------------------
# 1. BO SINH KICH BAN
# -----------------------------------------------------------------------------
# §6/E3 nguyen van: "create at least 5,000 reproducible scenarios using fixed
# random seeds. Sample mission distance, payload, wind conditions, SoC, SoH, and
# temperature from documented ranges. Use dataset-supported ranges for
# payload/speed/altitude wherever possible; clearly label any extrapolated
# ranges. Do not pretend these are real operational missions."
scenario_generator:
  module: "src/scenario_generator.py"
  n_scenarios: 18000
  n_scenarios_min_required: 5000
  sampling: "Latin hypercube tren 7 chieu lien tuc, do cao lay roi rac"
  seed: 42

  # ---------------------------------------------------------------------------
  # BON TANG — quyet dinh C9
  # ---------------------------------------------------------------------------
  # Lay mau uniform tren toan khong gian KHONG bao dam phu nhung vung quan trong
  # nhat. Chia tang de bao dam, va de tang dac biet khong lam loang bang chinh.
  # Moi tang dung seed DAN XUAT (seed + seed_offset): dung chung seed thi hai
  # tang lay cung chuoi quasi-random, tuc tuong quan voi nhau mot cach im lang.
  strata:

    main:
      n: 12600
      seed_offset: 0
      in_main_comparison: true
      purpose: "lay mau trong dai co tai lieu do lung"

    hard_rule_probe:
      n: 2100
      seed_offset: 1
      in_main_comparison: false
      purpose: >
        CO Y vuot gioi han van hanh, de lop luat cung co dip kich hoat. Tren bo
        du lieu CMU luat cung HR-1 (gio) CHUA BAO GIO kich hoat, nen chua tung
        duoc thu thach — day la cho duy nhat thu duoc.
      method: "LUOI BOI SO cua gioi han nha san xuat, khong lay mau ngau nhien"
      probe_multipliers: [1.10, 1.25, 1.50]
      probe_multipliers_source: "TEAM_CHOICE"
      probe_multipliers_affects_results: false
      probe_multipliers_basis: >
        Luat cung HR-1..HR-4 la nguong NHI PHAN: vuot la VETO, khong co muc do.
        Nen MOI gia tri tren gioi han deu thu dung mot thu, va boi so cu the
        KHONG the doi bat ky thuoc do nao. Day la ly do con so nay duoc phep la
        TEAM_CHOICE: no khong co bac tu do anh huong ket qua.
        Chon ba boi so chu khong mot, chi de bang bang chung cho thay luat chan
        ca sat nguong va xa nguong.
      limits_probed:
        # Gioi han lay tu reports/parameter_table.md muc 5 — so DJI cong bo.
        - variable: "wind_forecast_ms"
          dji_limit: 10.0
          limit_source: "SUPERVISOR/DJI — HR-1"
        - variable: "payload_g"
          dji_limit: 1245.0
          limit_source: "SUPERVISOR/DJI — HR-2"
        - variable: "speed_commanded_ms"
          dji_limit: 17.0
          limit_source: "SUPERVISOR/DJI — HR-3"
      removed_in_1_0_3: >
        Ban 1.0.1-1.0.2 lay mau dai [10,16], [500,1400], [12,20]. Ba so chan
        tren do nhom TU DAT, khong co nguon — va con sai: gioi han tai trong
        DJI la 1245 g chu khong phai 500, gioi han toc do 17 m/s chu khong phai
        12. Tuc dai cu vua bia so vua lay sai nguong. Xem quyet dinh C13.
      excluded_from_main_tables_because: >
        So sanh duong co so chi co nghia tren kich ban kha thi VE NGUYEN TAC.
        Kich ban gio 16 m/s thi MOI phuong phap deu phai tu choi; dua vao bang
        chung chi lam loang con so va lam B0/B1 trong khoe len mot cach gia.
        Tang nay co bang rieng va phuc vu thuoc do M-7.

    short_high:
      n: 2100
      seed_offset: 2
      in_main_comparison: true
      purpose: >
        Chuyen NGAN ma bay CAO — vung duy nhat luat PH-1 rang buoc hon luat du
        tru. Bo du lieu CMU co 0/192 truong hop nhu vay.
      range_overrides:
        distance_2d_m: [300.0, 419.0]
        altitude_m: [75, 100]

    missing_input:
      n: 1200
      seed_offset: 3
      in_main_comparison: false
      purpose: "thieu MOT dau vao an toan, de do ty le fail-closed tren kich ban tong hop"
      missing_fields_cycled: ["soc", "soh", "ambient_temp_c", "wind_forecast_ms"]
      method: >
        Bo trong theo CHI SO (i % 4), khong rut tham: tai lap duoc, va bao dam
        ca bon cot deu duoc thu chu khong de ngau nhien bo sot mot cot.
      excluded_from_main_tables_because: >
        Thieu dau vao thi dung phan quyet la INSUFFICIENT_DATA, khong phai
        FLY/NO_FLY. Dua vao confusion matrix se bop meo ca ba lop.
  seed_policy: >
    MOT seed duy nhat = 42, trung voi seed cua d2_protocol.yaml de ca de tai
    dung mot con so. CAM chay nhieu seed roi chon seed cho ket qua dep. Neu
    muon bao do on dinh theo seed thi phai bao CA BA seed 42/43/44 cung luc,
    day du, va khai o day truoc khi chay.
  seed_replicates_if_reported: [42, 43, 44]

  # Cot nao co du lieu do lung, cot nao la ngoai suy — nguon: parameter_table.md
  # muc 5. Moi kich ban PHAI mang co `extrapolated_*` tuong ung.
  variables:

    payload_g:
      range: [0, 500]
      distribution: "uniform"
      support: "DATASET_SUPPORTED"
      note: "phu 40 % dai van hanh (toi da 1245 g); KHONG lay mau tren 500 g"

    speed_commanded_ms:
      range: [4, 12]
      distribution: "uniform"
      support: "DATASET_SUPPORTED"
      note: "gioi han van hanh 17 m/s; khong lay mau ngoai 12"

    altitude_m:
      values: [25, 50, 75, 100]
      distribution: "discrete_uniform"
      support: "DATASET_SUPPORTED"
      note: "bo du lieu chi co bon muc roi rac — giu dung bon muc"

    distance_2d_m:
      range: [300, 900]
      distribution: "uniform"
      support: "PARTLY_EXTRAPOLATED"
      convention: "ROUND_TRIP — tong quang bay, dong quy uoc voi B7 cua D3"
      envelope_supported: [420, 610]
      extrapolation_flag: "extrapolated_distance = not (420 <= d <= 610)"
      note: >
        Day la chieu duy nhat CO Y lay mau ra ngoai envelope, vi thi nghiem E2c
        da do duoc huong lech (bias -7.6 Wh o 835 m) nen con so ngoai suy van
        doc duoc. Phai bao ket qua rieng cho hai vung trong/ngoai envelope.
        Doc theo cu ly giao hang MOT CHIEU thi dai nay la ~150-450 m.

    wind_forecast_ms:
      range: [0, 10]
      distribution: "uniform"
      support: "PARTLY_EXTRAPOLATED"
      dataset_coverage: [2.81, 6.67]
      extrapolation_flag: "extrapolated_wind = not (2.81 <= w <= 6.67)"
      note: >
        Lay mau toi 10 m/s de luat cung HR-1 co dip kich hoat — tren bo du lieu
        CMU no CHUA BAO GIO kich hoat (max 6.67). Lop luat cung cua D3 vi the
        chua tung duoc thu thach bang du lieu that; D4 la cho thu.

    soc:
      range: [0.10, 1.00]
      distribution: "uniform"
      support: "SCENARIO_PARAMETER"
      note: "khong co trong bo du lieu; la tham so kich ban theo §4.3"

    soh:
      range: [0.70, 1.00]
      distribution: "uniform"
      support: "PURE_EXTRAPOLATION"
      extrapolation_flag: "extrapolated_soh = True (luon luon)"
      note: >
        Bo du lieu KHONG co SoH. Moi ket qua theo SoH la PHAN TICH DO NHAY,
        khong phai du bao. §6/E3 bat dan nhan ro.

    ambient_temp_c:
      range: [-10, 40]
      distribution: "uniform"
      support: "PURE_EXTRAPOLATION"
      extrapolation_flag: "extrapolated_temp = True (luon luon)"
      kappa_valid_range: [4.5, 18.4]
      note: >
        Bo du lieu KHONG ghi nhiet do. Them vao do: kappa(T) chi hop le tren
        4.5-18.4 C, ngoai dai do bi KEP MOT PHIA theo B3 cua D3. Nen phan lon
        dai nhiet do nay mo hinh khong mo ta duoc gi — phai bao rieng ti le kich
        ban roi vao vung kep.

  energy_budget_conventions:
    inherit_from: "d3_protocol.yaml energy_required.budget_conventions (B9)"
    rule: >
      GIU NGUYEN ca bon quy uoc. CAM cong them nang luong cat/ha canh vao
      E_required — no DA nam trong output mo hinh D2. E_hover = 0.
    if_true_delivery_scenario: >
      Neu sau nay muon mo phong giao hang THAT (co tha hang) thi phai cong lai
      E_hover VA khai lai quy uoc chang ve (chang ve khong mang tai), va do la
      mot ban giao thuc MOI — khong duoc lam im lang trong ban nay.

  mandatory_coverage:
    # Muc dich: bao dam bo sinh khong bo trong nhung vung quan trong nhat.
    # `verified_by` quan trong: COV-1/2/4 tinh duoc tu truong THO nen bo sinh tu
    # kiem duoc; COV-3 can R = M/E_required, tuc dau ra mo hinh, nen chi kiem
    # duoc o buoc gan nhan. Quyet dinh C10.
    - id: "COV-1"
      requirement: "it nhat 500 kich ban vuot >= 1 gioi han luat cung"
      min_count: 500
      satisfied_by_stratum: "hard_rule_probe"
      verified_by: "GEN-4a"
      why: "de do duoc 'hard-rule violations incorrectly approved' (muc tieu 0)"
    - id: "COV-2"
      requirement: "it nhat 500 kich ban NGAN (d < 420 m) ma BAY CAO (>= 75 m)"
      min_count: 500
      satisfied_by_stratum: "short_high"
      verified_by: "GEN-4a"
      why: >
        Day la vung duy nhat luat PH-1 rang buoc hon luat du tru. Tren 192
        chuyen CMU co 0/192 kich ban nhu vay, nen PH-1 chua bao gio doi phan
        quyet. Neu D4 cung cho 0 thi KET LUAN LA BO SINH CHUA QUET DU RONG,
        khong phai PH-1 vo dung.
    - id: "COV-3"
      requirement: "it nhat 1000 kich ban nam trong dai bien (boundary) theo dinh nghia muc 4"
      min_count: 1000
      satisfied_by_stratum: null
      verified_by: "GEN-4b"
      why: "Muc 7 bat bao false-safe rieng cho vung bien va ngoai bien"
      note: >
        KHONG kiem duoc o bo sinh: vung bien dinh nghia theo R = M / E_required,
        ma E_required la dau ra mo hinh. Bo sinh khong biet no — va khong duoc
        biet, neu khong no co the nan dai kich ban theo cho mo hinh lam tot.
        Neu sau khi gan nhan ma COV-3 khong dat thi KHONG duoc sua dai kich ban
        de chay theo: phai nang `n_scenarios` va ghi vao change_log.
    - id: "COV-4"
      requirement: "it nhat 300 kich ban thieu it nhat mot dau vao an toan"
      min_count: 300
      satisfied_by_stratum: "missing_input"
      verified_by: "GEN-4a"
      why: "do ty le fail-closed tren kich ban tong hop, khong chi trong unit test"

# -----------------------------------------------------------------------------
# 2. NHAN THAM CHIEU — PHAN DE SAI NHAT CUA CA SAN PHAM D4
# -----------------------------------------------------------------------------
# §6/E3 goi day la "Reference decision (mandatory protocol)".
reference_label:
  status: >
    DA KY DU — Duy ky ban 1.0.6 (21/10/2026) cho REF-1, ba lop nhan, rui ro
    vong tron va anh xa dac trung; ky lai ban 1.0.8 (21/10/2026) cho phuong
    phap REF-2 da doi theo quyet dinh C22.
  approved_by: "DUY"
  approved_on: "2026-10-21"
  previous_approval:
    approved_by: "DUY"
    approved_on: "2026-10-21"
    protocol_version: "1.0.6"
    scope: >
      REF-1, ba lop nhan feasible/marginal/infeasible, rui ro vong tron, anh xa
      dac trung. Nhung phan nay KHONG doi o 1.0.8.

  independence_requirement: >
    §6/E3: "Prefer a reference procedure independent of the candidate model."
    Dung chinh mo hinh D2 de sinh nhan roi lai dung D2 de du bao thi chi do duoc
    "D2 co tu nhat quan khong", KHONG do duoc gi ve an toan. Day la rui ro vong
    tron, va Muc 12.1 bat phai GHI RA no du lam dung.

  method:
    id: "REF-1"
    name: "nhu cau tham chieu bao thu tu phan du do duoc"
    formula: >
      E_reference = E_d2_prediction + abs(q05(residual_signed_oof))
    naming_note: >
      Ban 1.0.0-1.0.3 goi so hang dau la `E_measured_proxy`. Ten do NOI DOI: no
      khong phai so do, no la DU BAO cua chinh mo hinh D2. Kich ban la tong hop,
      khong co chuyen bay that de do. Doi ten de doc la thay ngay vong tron —
      ma Muc 12.1 bat PHOI no ra, khong phai che. Xem quyet dinh C16.
    source_of_residuals: "reports/d2_oof_residuals.csv (out-of-fold, san pham D2)"
    residual_sign_convention: >
      PHAN DU = DU BAO - DO DUOC, theo src/evaluation_energy.py:
          residuals[name] = (oof_sum / max(oof_cnt, 1)) - y
      Nen phan du DUONG = doan THUA = huong AN TOAN; phan du AM = doan THIEU =
      huong NGUY HIEM. Phai ghi ro o day vi ban 1.0.1 da ghi NGUOC dau.
    uncertainty_allowance: >
      Lay DO LON CUA PHAN VI 5 cua phan du CO DAU — tuc duoi dai, phia doan
      THIEU. KHONG lay phan vi 95 (do la phia an toan), va KHONG lay phan vi 95
      cua TRI TUYET DOI (tron ca hai huong). Quyet dinh C11.
      Con so chot: xem muc `frozen_numbers` duoi.
    forbidden_source: >
      §6/E3: "never estimate the allowance from the final test fold."
      CAM tinh khoan du phong tu fold kiem cuoi.
    reserve_policy_for_reference:
      r: 0.20
      note: "dong he so du tru voi D3; khac r thi khong con so sanh duoc"

  three_classes:
    feasible:   "M_reference > 0 va bien du tru >= r"
    marginal:   "M_reference > 0 nhung bien du tru < r"
    infeasible: "M_reference <= 0"
    note: >
      Ba lop nay la cua NHAN THAM CHIEU, khong phai ba muc phan quyet cua he
      thong. Anh xa sang nhi phan feasible/infeasible de tinh precision/recall:
      marginal duoc gop vao `infeasible` cho phep do an toan (cach bao thu), VA
      phai bao them mot bang voi marginal gop vao `feasible` de nguoi doc thay
      ket qua phu thuoc cach gop the nao.

  circularity:
    risk: "CO — phai ghi ra bao cao, Muc 12.1 bat buoc"
    why: >
      `E_measured_proxy` khong phai nang luong do that (kich ban la tong hop,
      khong co chuyen bay that de do). No duoc dung lai tu mo hinh, nen nhan
      tham chieu KHONG hoan toan doc lap voi duong co so B3 (vua la mo hinh D2).
      Khoan cong q95 lam nhan BAO THU HON du bao, nhung khong xoa duoc ho hang
      ve ho mo hinh.
    mandatory_sensitivity: >
      §6/E3 bat: "add a sensitivity analysis with a distinct conservative
      reference assumption." Chay lai toan bo benchmark voi mot nhan tham chieu
      THU HAI, doc lap ho mo hinh — REF-2 duoi day — va bao ca hai ket qua canh
      nhau. Neu xep hang cac duong co so DOI khi thay nhan, do la ket qua phai
      bao, khong phai loi.

  sensitivity_method:
    id: "REF-2"
    name: "nhu cau tham chieu tu mo hinh vat ly"
    formula: >
      E_reference2 = k * P_ideal(takeoff_mass) * t_planned / 3600
    code_ref: "src/physics_m100.py ideal_hover_power_W() — cong suat treo LY TUONG"

    frozen_numbers:
      note: >
        Dien bang scripts/compute_ref2_calibration.py. DE TRONG co y: con so
        dong bang phai do nguoi dien va biet minh dang dien gi.
      calibration_k: 7.4400
      percentile: 95
      n_flights: 192
      computed_on: "2026-10-21"
      computed_from: "data/processed/flight_level.csv"

    calibration:
      definition: >
        k = p95( E_do_duoc / (P_ideal(khoi luong) * t_ke_hoach / 3600) )
        tren 192 chuyen that.
      source: "MEASURED"
      which_duration: >
        `duration_planned_s`, KHONG phai `duration_s`. Kich ban tong hop khong
        co thoi luong do duoc, nen phai hieu chinh tren cung dai luong ma REF-2
        se dung.
      why_p95_not_p50: >
        Nhan tham chieu phai BAO THU: tha doi THUA nang luong hon doi THIEU.
        Doi thieu thi nhan goi mot kich ban la kha thi trong khi thuc te khong —
        dap an sai theo huong nguy hiem.
      eta_cancels: >
        k ti le THUAN voi eta, uoc luong ti le NGHICH, nen E_ref2 KHONG phu
        thuoc he so hieu suat khop duoc. REF-2 gio chi dua vao hai thu: cong
        suat treo LY TUONG (dang dong tu khoi luong va dien tich dia, khong
        tham so khop nao) va MOT so vo huong do duoc.
      still_independent_of_d2: >
        §6/E3 doi "independent of the candidate model". k rut tu nang luong DO
        DUOC, khong phai tu dau ra hoi quy. Khong he so hoi quy nao di vao REF-2.
      runtime_check: >
        src/reference_labeller.py tinh lai k tu du lieu moi lan chay va NEM LOI
        neu lech so da dong bang quá 1e-3. Mot con so bi sua tay se khong di qua
        im lang.

    removed_in_1_0_3: >
      Ban 1.0.0-1.0.2 ghi `safety_k: 1.25`. Con so do KHONG co trong file thay,
      khong co trong Proposal, va khong tinh tu du lieu nao — nhom tu dat. Da bo.
      Xem quyet dinh C12.
    removed_in_1_0_8: >
      Ban 1.0.3-1.0.7 ghi `eta_dev: 0.034` va chia cho eta. Con so 0.034 CO
      nguon (sai lech kiem cheo bay treo), nhung no sai VIEC: no do sai lech cua
      he so hieu suat, khong do sai lech cua ca cong thuc. Chay thu cho thay
      REF-2 doi nhu cau trung vi 7.56 Wh khi REF-1 doi 23.65 va nang luong do
      duoc that la 20.79 — tuc REF-2 LAC QUAN gap 2.7 lan, nguoc han vai
      "conservative reference" ma §6/E3 giao. Xem quyet dinh C22.
    why_independent: >
      Khong dung bat ky he so hoi quy nao khop tu bo du lieu CMU, nen doc lap
      voi ca D1, D2, D3. Danh doi: tho hon, va chinh no cung co han che (khong
      co P_bl, P_par) — khai ro o D5_mo_hinh_vat_ly.md.
    honest_limitation: >
      PHAI neu trong bao cao, ba dieu:
      (1) He so k = 7.44 do tren 192 chuyen CMU, tat ca o cu ly ~472 m va mot
          dai tai trong 0-500 g. Ap cho kich ban ngoai dai do (300-900 m, tai
          toi 1867 g o tang probe) la NGOAI SUY. Khac mot con so tu dat o cho
          no co nguon va tinh lai duoc, nhung van la ngoai suy.
      (2) k hieu chinh tren `duration_planned_s` = cu ly/toc do, mot dai luong
          KE HOACH. No bo qua thoi gian leo, ha va treo, nen k dang ganh ca
          phan sai lech do — khong tach rieng duoc.
      (3) REF-2 va REF-1 khong doc lap HOAN TOAN: ca hai dung cung 192 chuyen
          bay. Chung doc lap ve HO MO HINH (REF-2 khong dung he so hoi quy nao),
          chu khong doc lap ve du lieu. Day la gioi han cua bo du lieu, khong
          sua duoc trong pham vi de tai.

  simulation_derived_label:
    required: true
    rule: >
      MOI bang, hinh va cau ket luan cua san pham D4 phai mang chu
      "simulation-derived". Muc 12.1: "labels explicitly marked
      simulation-derived" va cong chan "No claims of real-world safety
      validation".
    forbidden_words:
      - "ground truth"
      - "validated safety"
      - "real-world success rate"
      - "do chinh xac an toan"

  # ---------------------------------------------------------------------------
  # ANH XA DAC TRUNG — quyet dinh C17
  # ---------------------------------------------------------------------------
  # Cot cua bo kich ban KHONG trung ten voi tap dac trung cua mo hinh D2. Khai
  # anh xa o day thay vi doi ten cot kich ban, vi hai bo ten la HAI LOAI DAI
  # LUONG khac nhau: file kich ban mo ta KE HOACH NHIEM VU, flight_level.csv mo
  # ta BAN GHI CHUYEN BAY. Doi ten cot kich ban thanh `wind_raw_mean_ms` la gia
  # vo gio du bao chinh la gio do duoc.
  feature_mapping:
    model: "D2_ridge_preflight"
    feature_set_ref: "d2_protocol.yaml features.preflight (6 cot)"
    map:
      payload_num: "payload_g"
      speed_num: "speed_commanded_ms"
      altitude_num: "altitude_m"
      distance_2d_m: "distance_2d_m"
      duration_planned_s: "DERIVED: distance_2d_m / speed_commanded_ms"
      wind_raw_mean_ms: "wind_forecast_ms"

    derived_formula_source: >
      d2_protocol.yaml features.derived.duration_planned_s.formula —
      "distance_2d_m / speed_num", nguon §5.5. Cong thuc cua giao thuc D2,
      khong phai cua D4.

    substitution_declared:
      slot: "wind_raw_mean_ms"
      fed_with: "wind_forecast_ms"
      why_this_is_a_substitution: >
        Mo hinh D2 huan luyen tren GIO DO DUOC (cot tho tu cam bien, trung binh
        trong chuyen bay). Kich ban cung cap GIO DU BAO. Hai dai luong khac nhau.
      why_unavoidable: >
        Bo du lieu CMU KHONG co cot gio du bao nao. CA HAI bien the D2 (D2-a va
        D2-b) deu dung wind_raw_mean_ms — hai bien the khac nhau DUNG MOT dac
        trung va do la THOI LUONG, khong phai gio
        (xem test_features.py::test_two_variants_differ_by_exactly_one_feature).
        Nen D2-b — bien the "truoc chuyen bay" — van con DUNG MOT dau vao khong
        thuc su biet truoc khi bay: gio.
      already_known: >
        San pham D3 da ghi la han che so 13 ("gio do duoc dung thay gio du bao
        khi chay D3 tren 192 chuyen"). D4 la chieu nguoc: gio du bao nhet vao o
        hoc tu gio do. Cung mot ho hong, hai chieu.
      must_state_in_paper: true

  # ---------------------------------------------------------------------------
  # KHOP MO HINH MOT LAN — quyet dinh C18
  # ---------------------------------------------------------------------------
  model_fit:
    what: >
      Khop MOT LAN mo hinh D2_ridge_preflight tren CA 192 chuyen that, roi dong
      bang he so ra file. Dung bo he so do cho ca 6000 kich ban.
    authorised_by: >
      Muc 11 tuan 6 nguyen van: "finalize selected energy model".
      Muc 7 duong co so B3: "use the best validated model selected in E2".
    learns_from: "192 chuyen bay that (co energy_Wh do duoc)"
    predicts_for: "6000 kich ban tong hop (KHONG co cot nang luong nao)"
    never_learns_from_scenarios: >
      Mo hinh KHONG hoc tu kich ban, va khong the: kich ban khong co cot muc
      tieu. GEN-5 cam bo kich ban chua cot nang luong, co test canh.
    spec_frozen:
      features: "6 cot preflight cua d2_protocol.yaml — khong them bot"
      pipeline: "StandardScaler + Ridge, dung src/models.py make_d2()"
      alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
      alpha_selection: "CV long, random_state 42"
      data: "ca 192 chuyen"
      degrees_of_freedom: 0
    freeze_coefficients_to: "reports/d4_d2_frozen_coefficients.csv"
    cross_check: >
      Duy doi chieu bo he so do voi reports/d2_ridge_coefficients.csv da co tu
      tuan 6. Khop thi dung la mo hinh da chot; lech thi co gi sai. Day la cho
      lam viec khop nay KIEM DUOC — khong co file he so thi khong ai kiem duoc.
    why_a_26th_fit_is_needed: >
      O san pham D2, Ridge duoc khop 25 lan (5 fold x 5 lan lap), moi lan tren
      4/5 du lieu, de DO sai so. 25 bo he so do bi bo di — chung chi phuc vu
      viec do. Nen chua co bo he so nao dung duoc de du bao cho kich ban moi.
    error_of_the_final_fit_is_unknown: >
      QUAN TRONG, phai neu trong bao cao: MAE 0.657 Wh la sai so cua QUY TRINH
      cross-validation, KHONG phai cua bo he so cuoi cung. Mo hinh khop tren ca
      192 chuyen thi khong do duoc sai so cua chinh no — khong con du lieu nao
      no chua thay.
      => CAM viet "mo hinh nay sai 0.657 Wh".
      => Thuoc do bat dinh PHAI lay tu phan du out-of-fold cua 25 lan kia. Do
         chinh la nguon cua khoan 1.2924 Wh, va la ly do §6/E3 bat lay khoan du
         phong tu "out-of-fold measured-energy residuals".

  must_save_per_scenario:
    # §6/E3: "Save the reference-model version, parameter file, scenario seed,
    # reserve policy, and per-scenario label."
    - "reference_model_version"
    - "parameter_file_hash"
    - "scenario_seed"
    - "reserve_policy"
    - "reference_label"
    - "extrapolated_distance / extrapolated_wind / extrapolated_soh / extrapolated_temp"

  frozen_numbers:
    note: >
      Da tinh tu reports/d2_oof_residuals.csv bang scripts/compute_q95.py.
      DONG BANG — khong sua nua. OI-D4-3 da dong.
    uncertainty_allowance_Wh: 1.2924
    source_statistic: "abs(q05) cua phan du co dau"
    q05_signed_Wh: -1.2924
    q95_signed_Wh: 1.2915
    q95_abs_for_reference_Wh: 1.4687
    bias_Wh: 0.0105
    underprediction_share: 0.50
    n_flights: 192
    model_column: "D2_ridge_preflight"
    computed_on: "2026-10-20"
    computed_from: "reports/d2_oof_residuals.csv"
    cross_check: >
      q95(|phan du|) = 1.4687 KHOP dung con so quyet dinh B4 cua
      d3_protocol.yaml dang dung cho nguong R_fly. Nghia la D3 chon tri tuyet
      doi, D4 chon q05 co dau — hai thong ke khac nhau, chon CO Y THUC, khong
      phai mot cho nao sai. Xem C11.

# -----------------------------------------------------------------------------
# 3. DUONG CO SO — Muc 7
# -----------------------------------------------------------------------------
# Muc 12.1 doi: "B0/B1/B2/B3/B5 implemented where applicable".
baselines:

  B0:
    name: "Fixed SoC threshold"
    spec: "duyet bay neu SoC >= nguong, nguoc lai tu choi"
    thresholds: [0.20, 0.30, 0.40]
    required: true
    fairness: >
      Muc 7 bat QUET nguong de cho thay danh doi, CAM chi bao nguong tot nhat
      sau khi da xem ket qua. Ba nguong nay chot tu bay gio.
    ignores: "hoan toan khong biet nhu cau nhiem vu"

  B1:
    name: "Nominal endurance threshold"
    spec: "so thoi gian bay ke hoach voi thoi luong bay danh dinh tru du tru"
    required: true
    endurance_source: "SUPERVISOR/DJI — trang ho tro chinh thuc DJI Matrice 100"
    endurance_min: 13.0
    endurance_unit: "phut"
    endurance_config: "TB47D, tai 1000 g, bay treo"

    # Bang nguyen van DJI cong bo (Hovering Time, TB47D)
    dji_published_table:
      battery: "TB47D"
      airframe_mass_g: 2355          # "Weight (with TB47D battery)"
      max_takeoff_g: 3600            # "Max. Takeoff Weight"
      hovering_time_min:
        payload_0_g: 22
        payload_500_g: 17
        payload_1000_g: 13
      note_tb48d: "28 / 20 / 16 phut — dung cho do nhay S-1"

    why_13_min: >
      May bay CMU nang 3680 g KHONG tai. Cau hinh NANG NHAT ma DJI cong bo la
      khung 2355 g + tai 1000 g = 3355 g. Tuc may bay CMU o tai 0 g DA VUOT cau
      hinh nang nhat co so cong bo, vuot 325 g. Khong co so nao khop.
      => Lay 13 phut (dong 1000 g), la so BAO THU NHAT trong bang.
      CAM noi suy ra cho 1325 g: bang chi co ba diem, noi suy ra ngoai la bia so.

    fairness_condition: >
      Muc 7: "Must use matching aircraft/configuration and reserve assumption."
      KHONG khop duoc. B1 co HAI thien lech, ca hai ve phia LAC QUAN, phai khai
      trong bao cao:
        (1) KHOI LUONG — 13 phut do o 3355 g; may bay CMU 3680-4180 g, nang hon
            325-825 g. Nang hon thi bay duoc it hon, nen 13 phut la LAC QUAN.
        (2) BAY TREO khong phai BAY HANH TRINH — bang DJI la "Hovering Time".
            Bay hanh trinh 4-12 m/s rut cong suat khac bay treo. So nay khong
            phai thoi luong hanh trinh.
      => B1 se trong KHOE hon thuc te. Khi bao ket qua phai noi ro, neu khong
      nguoi doc se tuong B1 la mot doi thu cong bang.

    reserve_rule: >
      t_nhiem_vu <= endurance_kha_dung / (1 + r), voi r = 0.20 dong bo D3.
      Dang nay khop dinh nghia R = (co - can)/can cua §5.6, nen so sanh duoc
      voi B5. Dung (1 - r) se la mot dinh nghia du tru KHAC.

    soc_handling:
      decision: "endurance_kha_dung = 13 phut x SoC x SoH"
      decision_ref: "C19"
      source: "TEAM_CHOICE"
      affects_results: true
      basis: >
        Muc 7 ta B1 la "compare planned mission time with a documented nominal
        endurance figure and reserve" — khong noi co nhan SoC hay khong.
        Nhan SoC la cach doc VAN HANH tu nhien: con 60 % pin thi con 60 % thoi
        luong. KHONG nhan thi B1 duyet bay ca khi pin gan can, tuc false-safe
        gan 100 % tren moi kich ban pin thap — mot doi thu bu nhin, va dung no
        de lam B5 trong gioi la khong trung thuc.
      variant_also_reported: >
        BAO CA HAI: B1 (nhan SoC x SoH) va B1-pure (khong nhan). B1-pure la
        dang doc sat chu Muc 7 nhat. Bao ca hai thi nguoi doc thay ro phan nao
        cua ket qua den tu viec B1 khong biet SoC.

  B2:
    name: "Distance-only energy model"
    spec: "dung mo hinh D1 de du bao nang luong roi so voi nang luong kha dung"
    required: true
    model_ref: "D1_distance_only (d2_protocol.yaml models.D1)"
    caveat: >
      Mo hinh D1 THOAI HOA tren bo du lieu nay (180/192 chuyen cung mot tuyen,
      do lech chuan cu ly ~1 %). Nen B2 se rat yeu, va do KHONG phai vi cu ly
      khong quan trong ma vi du lieu khong cho cu ly thay doi. Phai viet thang
      ra, neu khong B5 se trong nhu thang ap dao mot cach gian lan.

  B3:
    name: "Multi-factor empirical model"
    spec: "dung mo hinh tot nhat da chot o E2"
    required: true
    model_ref: "D2_ridge_preflight"
    note: "day la duong co so manh nhat, va la cho rui ro vong tron tap trung"

  B4:
    name: "Physics-based energy model"
    required: false
    excluded: true
    exclusion_reason: >
      Muc 7 cho B4 dieu kien: "Only quantitative if M100 parameters are
      documented." Bang kiem tuong thich (§3.2) da ket luan KHA THI MOT PHAN:
      dung duoc cong suat cam ung va eta, KHONG dung duoc P_bl va P_par vi DJI
      khong cong bo ti so dac, he so can canh quat va dien tich can than. Nen
      B4 KHONG vao xep hang dinh luong — dung nguyen tac da ap cho mo hinh D5 o
      san pham D2, giu nhat quan.
      Muc 12.1 cung khong liet ke B4 trong danh sach bat buoc
      ("B0/B1/B2/B3/B5"), nen viec loai nay dung tieu chi.
    still_used_for: >
      Mo hinh vat ly VAN duoc dung, nhung o vai khac: sinh nhan tham chieu thu
      hai REF-2 (muc 2), va cung cap landing_energy_Wh() cho luat PH-1.

  B5:
    name: "Proposed safety-aware graded decision"
    spec: >
      mo hinh nang luong da chon + nang luong kha dung + nguong du tru + lop
      luat cung co quyen phu quyet
    required: true
    code_ref: "src/decision_rules.py assess()"
    note: "day la phuong phap cua nhom — thu duoc dem ra cham diem"

  ablation:
    id: "B5-noHR"
    spec: "B5 nhung TAT lop luat cung"
    required: true
    purpose: "Muc 7 bat bao rieng mot ablation nhu vay"
    hard_constraint: >
      "for analysis only, never as the operational recommendation."
      CAM trinh bay B5-noHR nhu mot cau hinh dung duoc. Bang nao co no phai co
      dong chu canh bao.

  hard_rule_policy:
    primary: "APPLY_TO_ALL"
    decision_ref: "C23"
    source: "TEAM_CHOICE"
    affects_results: true
    rule: >
      Lop luat cung (HR-1..HR-4, PH-1, PD-1, PD-2) ap cho MOI duong co so:
      B0, B1, B1-pure, B2, B3, B5. Nho vay chenh lech giua chung den HOAN TOAN
      tu CACH QUYET DINH NANG LUONG, khong lan sang chinh sach an toan.
    basis: >
      Muc 7 nguyen van: "Keep the safety-rule policy identical across methods
      where the comparison is intended to isolate the energy-decision method."
      Day dung la y do cua ca bang so sanh.
    why_not_the_other_reading: >
      Doc sat chu thi mo ta cua B5 la cho duy nhat nhac "hard-rule veto", nen co
      the hieu B0..B3 KHONG co lop luat cung. Nhung doc nhu vay thi B0 se duyet
      bay mot kich ban gio 15 m/s — va B5 thang khong phai vi quyet dinh nang
      luong tot hon ma vi doi thu khong co lop an toan. Do la mot doi thu bu
      nhin, va Muc 7 co cot "fairness condition" chinh de chan chuyen do.
    secondary_run_required: >
      BAT BUOC chay them mot bang voi luat cung TAT cho B0..B3 (giu nguyen cho
      B5), vi do la cach doc sat chu nhat. Bao ca hai bang canh nhau. Thuoc do
      M-7 ("so vi pham luat cung bi duyet sai") chi co y nghia o bang thu hai va
      o ablation B5-noHR — o bang chinh no bang 0 theo thiet ke.
    what_each_comparison_isolates:
      B2_vs_B3: "mo hinh nang luong — D1 chi cu ly so voi D2 da yeu to"
      B3_vs_B5: "chinh sach phan quyet — mot nguong so voi hai nguong co bac"
      B5_vs_B5noHR: "dong gop cua lop luat cung"
      B0_B1_vs_phan_con_lai: "co dung mo hinh nang luong hay khong"

  verdict_vocabulary:
    binary_methods: ["B0", "B1", "B1-pure", "B2", "B3"]
    binary_values: ["FLY", "NO_FLY", "INSUFFICIENT_DATA"]
    graded_methods: ["B5", "B5-noHR"]
    graded_values: ["FLY", "CONDITIONAL", "NO_FLY", "INSUFFICIENT_DATA"]
    rule: >
      B0..B3 la quy tac NHI PHAN theo dung mo ta Muc 7 — duyet hoac tu choi.
      Chi B5 co bac giua, vi muc giua CHINH LA dong gop cua phuong phap nhom
      (§5.7). Nen confusion matrix BA LOP (thuoc do M-6) chi ap cho B5; con
      M-5 (nhi phan) ap cho tat ca.
    conditional_maps_to: >
      Khi xep B5 vao bang nhi phan de so voi B0..B3: CONDITIONAL duoc tinh la
      KHONG duyet bay, vi §2.3 noi CONDITIONAL chua thuc thi duoc khi chua co
      bien phap. Bao them mot bang voi cach gop nguoc lai — cung tinh than do
      nhay S-3.

  fairness_rules:
    - "moi phuong phap chay tren CUNG mot bo kich ban (cung seed, cung file)"
    - "giu CUNG chinh sach luat an toan khi muc dich la co lap phuong phap nang luong"
    - "khong phuong phap nao duoc tinh chinh bang ket qua benchmark nay"
    - >
      B0 va B1 khong dung mo hinh nang luong nao, nen khi bao phai noi ro chung
      thua o DAU: thua vi khong biet nhu cau, chu khong phai vi nguong dat kem.

# -----------------------------------------------------------------------------
# 4. VUNG BIEN — dinh nghia truoc khi do
# -----------------------------------------------------------------------------
boundary_definition:
  rule: "|R - 0| <= w  HOAC  |R - r| <= w"
  w: 0.05
  rule_corrected_in_1_0_7: >
    Ban 1.0.0-1.0.6 ghi "|R - R_fly| <= w HOAC |R - R_min| <= w". Sai doi tuong:
    R_fly va R_min la NGUONG CUA HE THONG (san pham D3), con vung bien o day
    phai do theo BIEN CUA NHAN THAM CHIEU, vi thuoc do false-safe cham he thong
    SO VOI NHAN.
    Nhan tham chieu co dung hai bien:
        R = 0   giua `infeasible` va `marginal`   (M = 0)
        R = r   giua `marginal`  va `feasible`
    Ma R_min = r nen mot nua cong thuc cu tinh co dung; nua con lai (R_fly) thi
    sai, va R_fly con doi theo tung nhiem vu.
    Code (`_la_vung_bien`) tu dau da tinh theo R = 0 va R = r — tuc code dung,
    VAN BAN giao thuc sai. Sua van ban cho khop code.
    Dem thu ca hai cach tren 6000 kich ban: cach dung 405, cach cu 286.
    Xem quyet dinh C21.
  where: "R = M / E_required, theo d3_protocol.yaml muc 5"
  source: "TEAM_CHOICE"
  affects_results: true
  why_needed: >
    Muc 7 bat bao false-safe RIENG cho vung bien va ngoai bien, nhung KHONG
    dinh nghia vung bien rong bao nhieu. Nhom phai chon mot con so.
  why_this_value: >
    w = 0.05 la MOT PHAN TU cua he so du tru r = 0.20 (so cua thay). Chon theo
    ty le cua r chu khong theo con so tron, de neu thay doi r thi dinh nghia
    vung bien di theo mot cach co quy tac.
  guard: >
    Day la con so DOI DUOC KET QUA: w rong hon thi vung bien dong hon, va
    false-safe rate cua tung vung thay doi theo. Nen KHONG duoc khai mot gia
    tri roi im lang — bat buoc chay do nhay S-4 voi w = 0.025 va w = 0.10, va
    bao ca ba trong bao cao. Neu ket luan doi theo w thi do la ket qua phai
    bao, khong phai loi.
  frozen: true
  added_in_1_0_3: >
    Ban 1.0.0-1.0.2 ghi `0.05` khong kem nguon va khong co do nhay — doc ra
    nhu mot con so cua thay. Xem quyet dinh C14.

# -----------------------------------------------------------------------------
# 5. THUOC DO — Muc 7 + P§4.9
# -----------------------------------------------------------------------------
metrics:
  primary: "infeasible_scenario_recall"
  primary_why: "Muc 7 goi day la 'primary safety metric'"

  required:
    - id: "M-1"
      name: "infeasible-scenario recall"
      spec: "ti le kich ban tham chieu-infeasible ma he thong KHONG ra FLY"
    - id: "M-2"
      name: "false-safe rate"
      spec: "ti le kich ban tham chieu-infeasible ma he thong ra FLY"
      note: "day la con so phai bao du no xau — khong duoc doi sang accuracy"
    - id: "M-3"
      name: "false-safe count va rate theo vung bien / ngoai bien"
      spec: "tach theo boundary_definition muc 4"
    - id: "M-4"
      name: "unnecessary-rejection rate"
      spec: "ti le kich ban tham chieu-feasible ma he thong ra NO_FLY"
    - id: "M-5"
      name: "precision, recall, F1, confusion matrix nhi phan"
    - id: "M-6"
      name: "confusion matrix ba lop FLY / CONDITIONAL / NO_FLY"
    - id: "M-7"
      name: "so vi pham luat cung bi duyet sai"
      target: 0
      note: "Muc 7: 'target: zero by design'. Khac 0 la LOI THIET KE, khong phai diem kem."
    - id: "M-8"
      name: "decision latency"
      spec: "ms, bao trung vi va p95; so phu thuoc phan cung nen chi noi ti le"

  additional_required_by_d4:
    - id: "M-9"
      name: "ti le kich ban ma PH-1 rang buoc hon luat du tru"
      why: >
        Tren bo du lieu CMU con so nay la 0/192. Neu D4 cung ra 0 thi bo sinh
        chua quet du rong (xem COV-2). Day la thuoc do rieng cua nhom, khai de
        khong ai tuong no den tu Muc 7.
    - id: "M-10"
      name: "ti le kich ban fail-closed dung (thieu dau vao -> khong FLY)"
      target: 1.0

  tradeoff_curve:
    required: true
    spec: "duong danh doi false-safe vs unnecessary-rejection, quet qua he so du tru VA qua nguong SoC co dinh"
    source: "Muc 7: 'Results must include the trade-off curve over reserve factors and fixed-SoC thresholds.'"
    reserve_sweep: [0.10, 0.15, 0.20, 0.25, 0.30]
    reserve_sweep_source: "TEAM_CHOICE (mo rong tu ba muc cua D3)"
    reserve_sweep_affects_results: false
    reserve_sweep_basis: >
      r = 0.20 la so cua thay (§5.6). Ba muc 0.10 / 0.20 / 0.30 da dung o san
      pham D3. Them 0.15 va 0.25 chi de duong danh doi co du diem ve, khong
      doi ket luan tai bat ky diem nao — moi diem duoc tinh doc lap.
    soc_threshold_sweep: [0.20, 0.30, 0.40]
    soc_threshold_sweep_source: >
      SUPERVISOR — Muc 7 duong co so B0 nguyen van: "Test several threshold
      values (e.g., 20%, 30%, 40%)". Ba con so nay la cua thay.

  success_criterion:
    text: >
      Muc 7 nguyen van: "the multi-factor approach must improve the
      safety-relevant metrics without hiding a large increase in unnecessary
      rejection."
    operationalised: >
      B5 phai cho false-safe rate THAP HON B0 va B1 o cung muc
      unnecessary-rejection, doc tren duong danh doi — khong so hai con so roi
      le o hai diem van hanh khac nhau.
    honesty_clause: >
      Neu B3 (chi mo hinh, khong luat cung) ngang B5 thi KET LUAN LA LOP LUAT
      CUNG khong doi duoc gi tren bo kich ban nay, va phai viet thang ra. Khong
      duoc di tim mot bo kich ban khac cho B5 thang.

# -----------------------------------------------------------------------------
# 6. DO NHAY BAT BUOC
# -----------------------------------------------------------------------------
mandatory_sensitivity_runs:
  - id: "S-1"
    what: "E_nominal = 129.96 Wh (TB48D) thay cho 99.9 Wh (TB47D)"
    source: >
      P§4.4 nguyen van: "Enominal is taken from the manufacturer's published
      figure for the installed pack, 129.96 Wh for a TB48D and 99.9 Wh for a
      TB47D [3]; which pack the recorded flights used MUST BE CONFIRMED from
      the dataset documentation rather than assumed."
