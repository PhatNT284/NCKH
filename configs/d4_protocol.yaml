        resolution: >
          BANG CHINH: ap cho TAT CA. Nho vay chenh lech giua cac duong co so den
          hoan toan tu cach quyet dinh nang luong.
          BANG THU HAI (bat buoc): tat luat cung cho B0..B3, giu cho B5 — cach
