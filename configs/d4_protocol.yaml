  - version: "1.0.8"
    date: "2026-10-21"
    author: "Phat"
    changes: >
      Doi PHUONG PHAP nhan tham chieu thu hai REF-2 (quyet dinh C22). Phat hien
      khi chay buoc gan nhan lan dau tren 18000 kich ban.
      XOA chu ky — phuong phap doi thi phai ky lai (OI-D4-5). Ban ghi ky cu giu
      o reference_label.previous_approval.
      KHONG doi REF-1, khong doi ba lop nhan, khong doi khoan du phong 1.2924,
      khong doi dai lay mau, khong doi thuoc do.
      PHAI gan nhan lai sau khi dien he so va ky.
    decisions:

      - id: "C22"
        question: >
          Chay thu cho thay REF-2 doi nhu cau nang luong trung vi 7.56 Wh, khi
          REF-1 doi 23.65 Wh va nang luong DO DUOC THAT cua 192 chuyen la
          20.79 Wh. REF-2 thap hon REF-1 o 98 % kich ban. §6/E3 giao cho REF-2
          dung mot viec: "a distinct CONSERVATIVE reference assumption". Nhu vay
          REF-2 co lam duoc viec do khong?
        resolution: >
          KHONG. Da doi cong thuc:
            cu  E_ref2 = P_hover(m)/eta * t/3600 * (1 + 0.034)
            moi E_ref2 = k * P_ideal(m) * t/3600,
                voi k = p95( E_do_duoc / (P_ideal(m) * t/3600) ) tren 192 chuyen.
        basis: >
          Cong thuc cu bo qua nang luong LEO 25-100 m, HA va TREO; thoi gian
          thuc cua chuyen bay dai hon cu ly/toc do, va cong suat bay hanh trinh
          cao hon cong suat treo ly tuong. Tinh thu mot chuyen dien hinh: cong
          thuc cu cho 6.1 Wh, do duoc 20.79 Wh — lech 3.4 lan.
          He so 0.034 CO nguon nhung sai VIEC: no do sai lech cua he so hieu
          suat, khong do sai lech cua ca cong thuc.
        measured_result: >
          Voi k = p95 (do thu tren du lieu, uoc ~7.44): REF-2 cho trung vi
          ~32 Wh tren 192 chuyen that, tuc doi THUA ~54 % so voi muc do duoc, va
          chi 10/192 chuyen doi thieu (5 %, dung nhu p95 ham y).
          => REF-2 gio bao thu HON ca REF-1, dung vai ma §6/E3 giao.
        two_properties_gained:
          - >
            eta TRIET TIEU — E_ref2 khong con phu thuoc he so hieu suat khop
            duoc. REF-2 chi dua vao cong suat treo LY TUONG (dang dong, khong
            tham so khop) va MOT so vo huong do duoc.
          - >
            VAN doc lap voi mo hinh D2: k rut tu nang luong DO DUOC, khong phai
            tu dau ra hoi quy.
        not_the_same_as_safety_k: >
          safety_k = 1.25 bi bo o C12 vi nhom TU DAT. k nay DO tu 192 chuyen
          that, co script tinh lai duoc, va co kiem doi chieu luc chay.
        impact: >
          Nhan REF-2 doi => do nhay S-2 doi. Nhan REF-1 KHONG doi (da kiem:
          feasible 11950, infeasible 3763, marginal 1087, unknown 1200, vung
          bien 1077 — tinh doc lap hai lan, khop).
          Chua co bang ket qua nao nen khong co gi phai tinh lai.

