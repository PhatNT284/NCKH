         khoi luong cat canh toi da 3600 g => tai trong toi da 1245 g / 1169 g.
         Nguon: trang ho tro chinh thuc DJI."

  - version: "1.3.0"
    date: "2026-10-14"
    author: "Phat"
    changes: >
      Hoan tat bao cao chot mo hinh va bang tham so nang luong kha dung (tuan 6).
