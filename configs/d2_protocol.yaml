      - "Them khoang tin cay bootstrap cap chuyen bay (§5.3, §8 muc 2) —
         src/bootstrap_ci.py."
      - "Them nhat ky thi nghiem (§8 muc 6) — src/experiment_log.py, ghi vao
         reports/experiment_log.jsonl."
      - "Dong OI-1: giay phep bo du lieu da xac nhan la CC BY 4.0."

  - version: "1.2.0"
    date: "2026-10-14"
    author: "Phat"
    changes: >
      Hoan tat bang kiem tuong thich D5 (§3.2). KHONG doi dinh nghia muc tieu,
      tap dac trung, cach chia tap hay ket qua D0-D3 — khong phai chay lai thi
      nghiem nao.
    details:
      - "D5: bang kiem 8 muc da dien. Ket luan kha thi mot phan, khong vao xep
